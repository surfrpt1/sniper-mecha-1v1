<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sniper Mecha 1v1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #gameWrapper {
            position: relative;
            width: min(100vw, 100vh * 1.5); /* maintain 3:2 aspect */
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 3 / 2;
            touch-action: none;
            background: #141428;
            border-radius: 12px;
            border: 2px solid #2a2a4a;
            box-shadow: 0 0 40px rgba(0, 100, 255, 0.2);
            overflow: hidden;
        }
        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            background: #141428;
            touch-action: none;
            pointer-events: auto;
        }

        /* Menu overlay */
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 30, 0.85);
            backdrop-filter: blur(6px);
            border-radius: 12px;
            z-index: 20;
            pointer-events: auto;
            transition: opacity 0.3s;
        }
        #menu.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #menu h1 {
            font-size: clamp(2rem, 8vw, 4rem);
            color: #88ccff;
            text-shadow: 0 0 20px #44aaff;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        #menu p {
            color: #8899bb;
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            margin-bottom: 30px;
        }
        .menu-btn {
            background: #1a2a4a;
            border: 2px solid #3a6a9a;
            color: #ccddff;
            font-size: clamp(1rem, 3vw, 1.6rem);
            padding: 12px 28px;
            margin: 10px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            min-width: 160px;
            text-align: center;
            font-weight: 600;
            letter-spacing: 1px;
            touch-action: manipulation;
        }
        .menu-btn:hover {
            background: #2a4a7a;
            border-color: #6a9aff;
            transform: scale(1.03);
        }
        .menu-btn:active {
            transform: scale(0.97);
        }
        .menu-btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #3a3a4a;
        }

        /* Touch controls overlay */
        #controlsOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            touch-action: none;
        }
        #controlsOverlay.active {
            pointer-events: auto;
        }
        .joystick-area {
            position: absolute;
            width: 30%;
            aspect-ratio: 1/1;
            bottom: 8%;
            left: 5%;
            pointer-events: auto;
            touch-action: none;
            transition: all 0.1s;
        }
        .joystick-base {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            position: relative;
            touch-action: none;
        }
        .joystick-thumb {
            width: 45%;
            height: 45%;
            border-radius: 50%;
            background: rgba(100, 180, 255, 0.5);
            border: 2px solid rgba(100, 180, 255, 0.8);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            touch-action: none;
            transition: none;
        }
        .fire-btn {
            position: absolute;
            width: 18%;
            aspect-ratio: 1/1;
            bottom: 10%;
            right: 8%;
            border-radius: 50%;
            background: radial-gradient(circle, #ff6644, #cc2200);
            border: 3px solid #ffaa44;
            color: white;
            font-size: clamp(1.2rem, 4vw, 2.2rem);
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: manipulation;
            box-shadow: 0 0 30px rgba(255, 50, 0, 0.5);
            cursor: pointer;
            text-shadow: 0 0 10px rgba(255,255,200,0.8);
            user-select: none;
            transition: all 0.1s;
        }
        .fire-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 50px rgba(255, 50, 0, 0.8);
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #aac;
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            font-family: monospace;
            z-index: 15;
            pointer-events: none;
            text-shadow: 0 0 10px #000;
            line-height: 1.6;
        }
        #hud .timer {
            font-size: clamp(1rem, 3vw, 1.6rem);
            color: #ffcc44;
        }
        #settingsBtn {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 16;
            background: rgba(0,0,0,0.5);
            border: 1px solid #3a5a7a;
            color: #ccddff;
            border-radius: 50%;
            width: clamp(28px, 4vw, 36px);
            height: clamp(28px, 4vw, 36px);
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            touch-action: manipulation;
            transition: 0.2s;
        }
        #settingsBtn:hover {
            background: rgba(30,60,100,0.7);
        }
        #settingsBtn:active {
            transform: scale(0.9);
        }

        /* Settings panel */
        #settingsPanel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(90%, 400px);
            background: rgba(10,10,30,0.95);
            border: 2px solid #3a5a8a;
            border-radius: 20px;
            padding: 24px 20px;
            z-index: 30;
            display: none;
            flex-direction: column;
            gap: 16px;
            backdrop-filter: blur(8px);
            pointer-events: auto;
        }
        #settingsPanel.show {
            display: flex;
        }
        #settingsPanel h2 {
            color: #88ccff;
            font-size: 1.4rem;
            text-align: center;
            margin-bottom: 4px;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #aac;
            font-size: 0.95rem;
        }
        .setting-row input[type="range"] {
            width: 60%;
            accent-color: #44aaff;
            background: #1a2a3a;
            height: 4px;
            border-radius: 4px;
            -webkit-appearance: none;
        }
        .setting-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #44aaff;
            cursor: pointer;
        }
        .setting-row span {
            min-width: 30px;
            text-align: right;
            color: #88ccff;
        }
        .settings-close-btn {
            background: #2a3a5a;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 6px;
            touch-action: manipulation;
        }
        .settings-close-btn:active {
            transform: scale(0.96);
        }
        .settings-reset-btn {
            background: #3a2a2a;
            border: none;
            color: #ff8866;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            touch-action: manipulation;
        }

        /* Game Over overlay */
        #gameOverMenu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(4px);
            border-radius: 12px;
            z-index: 25;
            pointer-events: auto;
        }
        #gameOverMenu.show {
            display: flex;
        }
        #gameOverMenu h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            margin-bottom: 10px;
            text-shadow: 0 0 30px currentColor, 0 0 60px #000;
            color: #fff;
        }
        #gameOverMenu .sub {
            color: #ddd;
            font-size: clamp(1rem, 2vw, 1.4rem);
            margin-bottom: 30px;
            text-shadow: 0 0 20px #000;
        }
        #gameOverMenu .menu-btn {
            min-width: 160px;
            font-size: clamp(1rem, 2vw, 1.2rem);
            padding: 12px 28px;
        }

        /* Hide canvas border when wrapper is used */
        canvas {
            border: none;
        }
        #gameWrapper {
            border: 2px solid #2a2a4a;
        }

        @media (max-width: 600px) {
            #menu h1 { font-size: 2.4rem; }
            .menu-btn { font-size: 1.2rem; padding: 12px 28px; min-width: 160px; }
            .fire-btn { font-size: 1.2rem; }
            #hud { font-size: 0.8rem; }
            #hud .timer { font-size: 1.2rem; }
            #settingsBtn { width: 30px; height: 30px; font-size: 1rem; top: 8px; right: 8px; }
        }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <canvas id="gameCanvas" width="900" height="600"></canvas>

        <!-- Menu -->
        <div id="menu">
            <h1>🔫 SNIPER MECHA</h1>
            <p>1v1 · BGMI WOW Style</p>
            <button class="menu-btn" id="playBtn">▶ Play vs Bot</button>
            <button class="menu-btn disabled" id="multiBtn">🌐 Online (coming soon)</button>
        </div>

        <!-- Game Over -->
        <div id="gameOverMenu">
            <h1 id="gameOverTitle">🏆 YOU WIN!</h1>
            <div class="sub" id="gameOverSub">Match over</div>
            <button class="menu-btn" id="gameOverReturnBtn">↩ Return to Menu</button>
        </div>

        <!-- HUD -->
        <div id="hud">
            <div>HP: <span id="hudPlayerHP">100</span></div>
            <div>Enemy: <span id="hudEnemyHP">100</span></div>
            <div class="timer">⏱ <span id="hudTimer">60</span>s</div>
        </div>

        <!-- Settings Button -->
        <div id="settingsBtn">⚙</div>

        <!-- Settings Panel -->
        <div id="settingsPanel">
            <h2>⚙ Controls</h2>
            <div class="setting-row">
                <label>Joystick size</label>
                <input type="range" id="joySizeSlider" min="15" max="45" value="30" step="1" />
                <span id="joySizeVal">30%</span>
            </div>
            <div class="setting-row">
                <label>Fire button size</label>
                <input type="range" id="fireSizeSlider" min="10" max="30" value="18" step="1" />
                <span id="fireSizeVal">18%</span>
            </div>
            <div class="setting-row">
                <label>Joystick X offset</label>
                <input type="range" id="joyXSlider" min="0" max="20" value="5" step="0.5" />
                <span id="joyXVal">5%</span>
            </div>
            <div class="setting-row">
                <label>Joystick Y offset</label>
                <input type="range" id="joyYSlider" min="0" max="20" value="8" step="0.5" />
                <span id="joyYVal">8%</span>
            </div>
            <div class="setting-row">
                <label>Fire X offset</label>
                <input type="range" id="fireXSlider" min="0" max="20" value="8" step="0.5" />
                <span id="fireXVal">8%</span>
            </div>
            <div class="setting-row">
                <label>Fire Y offset</label>
                <input type="range" id="fireYSlider" min="0" max="20" value="10" step="0.5" />
                <span id="fireYVal">10%</span>
            </div>
            <button class="settings-reset-btn" id="resetSettingsBtn">↺ Reset to default</button>
            <button class="settings-close-btn" id="settingsCloseBtn">Close</button>
        </div>

        <!-- Touch Controls -->
        <div id="controlsOverlay">
            <div class="joystick-area" id="moveJoystickArea">
                <div class="joystick-base" id="moveJoystickBase">
                    <div class="joystick-thumb" id="moveJoystickThumb"></div>
                </div>
            </div>
            <div class="fire-btn" id="fireBtn">🔥</div>
        </div>
    </div>

    <script>
        // ===== DOM refs =====
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu');
        const playBtn = document.getElementById('playBtn');
        const multiBtn = document.getElementById('multiBtn');
        const hudPlayerHP = document.getElementById('hudPlayerHP');
        const hudEnemyHP = document.getElementById('hudEnemyHP');
        const hudTimer = document.getElementById('hudTimer');
        const controlsOverlay = document.getElementById('controlsOverlay');
        const moveJoystickArea = document.getElementById('moveJoystickArea');
        const moveJoystickBase = document.getElementById('moveJoystickBase');
        const moveJoystickThumb = document.getElementById('moveJoystickThumb');
        const fireBtn = document.getElementById('fireBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const settingsCloseBtn = document.getElementById('settingsCloseBtn');
        const resetSettingsBtn = document.getElementById('resetSettingsBtn');
        const gameOverMenu = document.getElementById('gameOverMenu');
        const gameOverTitle = document.getElementById('gameOverTitle');
        const gameOverSub = document.getElementById('gameOverSub');
        const gameOverReturnBtn = document.getElementById('gameOverReturnBtn');

        // Settings sliders
        const joySizeSlider = document.getElementById('joySizeSlider');
        const fireSizeSlider = document.getElementById('fireSizeSlider');
        const joyXSlider = document.getElementById('joyXSlider');
        const joyYSlider = document.getElementById('joyYSlider');
        const fireXSlider = document.getElementById('fireXSlider');
        const fireYSlider = document.getElementById('fireYSlider');
        const joySizeVal = document.getElementById('joySizeVal');
        const fireSizeVal = document.getElementById('fireSizeVal');
        const joyXVal = document.getElementById('joyXVal');
        const joyYVal = document.getElementById('joyYVal');
        const fireXVal = document.getElementById('fireXVal');
        const fireYVal = document.getElementById('fireYVal');

        // ===== Canvas dimensions (logical) =====
        const W = 900, H = 600;

        // ===== Game state =====
        const STATE = { MENU: 0, COUNTDOWN: 1, PLAYING: 2, GAMEOVER: 3 };
        let gameState = STATE.MENU;
        let countdown = 3;
        let matchTime = 60;
        let matchTimerInterval = null;
        let gameOverWinner = null;

        // ===== Players =====
        const player = {
            x: 150, y: 300,
            radius: 20,
            speed: 3.5,
            health: 100,
            maxHealth: 100,
            angle: 0,
            cooldown: 0,
            shootCooldown: 40,
            alive: true
        };
        const enemy = {
            x: 750, y: 300,
            radius: 20,
            speed: 2.0,
            health: 100,
            maxHealth: 100,
            angle: 0,
            cooldown: 0,
            shootCooldown: 50,
            alive: true,
            state: 'idle',
            timer: 0
        };

        let bullets = [];
        const bulletSpeed = 8;
        const bulletRadius = 4;

        const obstacles = [
            { x: 350, y: 200, w: 60, h: 40 },
            { x: 500, y: 380, w: 40, h: 60 },
            { x: 200, y: 450, w: 80, h: 30 },
            { x: 650, y: 100, w: 30, h: 80 },
            { x: 450, y: 280, w: 20, h: 20 }
        ];

        // ===== Input =====
        const keys = { w: false, a: false, s: false, d: false };
        let mouseX = player.x, mouseY = player.y;
        let mouseDown = false;

        // Touch joystick
        let joystickActive = false;
        let joystickDX = 0, joystickDY = 0;
        let touchFire = false;

        // Settings (stored in localStorage)
        const defaultSettings = {
            joySize: 30,
            fireSize: 18,
            joyX: 5,
            joyY: 8,
            fireX: 8,
            fireY: 10
        };
        let settings = { ...defaultSettings };

        function loadSettings() {
            try {
                const stored = JSON.parse(localStorage.getItem('sniperMechaSettings'));
                if (stored) {
                    for (let key in defaultSettings) {
                        if (stored[key] !== undefined) settings[key] = stored[key];
                    }
                }
            } catch(e) {}
            applySettingsUI();
            applySettingsToControls();
        }

        function saveSettings() {
            localStorage.setItem('sniperMechaSettings', JSON.stringify(settings));
        }

        function applySettingsUI() {
            joySizeSlider.value = settings.joySize;
            fireSizeSlider.value = settings.fireSize;
            joyXSlider.value = settings.joyX;
            joyYSlider.value = settings.joyY;
            fireXSlider.value = settings.fireX;
            fireYSlider.value = settings.fireY;
            joySizeVal.textContent = settings.joySize + '%';
            fireSizeVal.textContent = settings.fireSize + '%';
            joyXVal.textContent = settings.joyX + '%';
            joyYVal.textContent = settings.joyY + '%';
            fireXVal.textContent = settings.fireX + '%';
            fireYVal.textContent = settings.fireY + '%';
        }

        function applySettingsToControls() {
            moveJoystickArea.style.width = settings.joySize + '%';
            moveJoystickArea.style.aspectRatio = '1/1';
            moveJoystickArea.style.bottom = settings.joyY + '%';
            moveJoystickArea.style.left = settings.joyX + '%';

            fireBtn.style.width = settings.fireSize + '%';
            fireBtn.style.aspectRatio = '1/1';
            fireBtn.style.bottom = settings.fireY + '%';
            fireBtn.style.right = settings.fireX + '%';
        }

        function resetSettingsToDefault() {
            settings = { ...defaultSettings };
            saveSettings();
            applySettingsUI();
            applySettingsToControls();
        }

        // ===== Helpers =====
        function dist(x1, y1, x2, y2) {
            return Math.hypot(x2 - x1, y2 - y1);
        }

        function collidesWithObstacles(x, y, r) {
            for (let o of obstacles) {
                const closestX = Math.max(o.x, Math.min(x, o.x + o.w));
                const closestY = Math.max(o.y, Math.min(y, o.y + o.h));
                if (dist(x, y, closestX, closestY) < r) return true;
            }
            return false;
        }

        function movePlayer(p, dx, dy) {
            let nx = p.x + dx;
            let ny = p.y + dy;
            if (nx - p.radius < 0) nx = p.radius;
            if (nx + p.radius > W) nx = W - p.radius;
            if (ny - p.radius < 0) ny = p.radius;
            if (ny + p.radius > H) ny = H - p.radius;
            if (!collidesWithObstacles(nx, ny, p.radius)) {
                p.x = nx;
                p.y = ny;
            } else {
                if (!collidesWithObstacles(nx, p.y, p.radius)) {
                    p.x = nx;
                } else if (!collidesWithObstacles(p.x, ny, p.radius)) {
                    p.y = ny;
                }
            }
        }

        function shoot(shooter, targetX, targetY, isEnemy = false) {
            if (shooter.cooldown > 0) return;
            const angle = Math.atan2(targetY - shooter.y, targetX - shooter.x);
            const speed = bulletSpeed;
            bullets.push({
                x: shooter.x + Math.cos(angle) * (shooter.radius + 4),
                y: shooter.y + Math.sin(angle) * (shooter.radius + 4),
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: bulletRadius,
                isEnemy: isEnemy,
                alive: true
            });
            shooter.cooldown = shooter.shootCooldown;
        }

        // ===== AI =====
        function updateAI() {
            if (!enemy.alive) return;
            enemy.angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
            const distToPlayer = dist(enemy.x, enemy.y, player.x, player.y);
            if (distToPlayer > 500) enemy.state = 'chase';
            else if (distToPlayer < 250) enemy.state = 'retreat';
            else enemy.state = 'idle';

            let dx = 0, dy = 0;
            if (enemy.state === 'chase') {
                dx = Math.cos(enemy.angle) * enemy.speed;
                dy = Math.sin(enemy.angle) * enemy.speed;
            } else if (enemy.state === 'retreat') {
                dx = -Math.cos(enemy.angle) * enemy.speed * 0.7;
                dy = -Math.sin(enemy.angle) * enemy.speed * 0.7;
            } else {
                if (enemy.timer % 120 < 60) {
                    dx = Math.cos(enemy.angle + Math.PI/2) * 0.8;
                    dy = Math.sin(enemy.angle + Math.PI/2) * 0.8;
                } else {
                    dx = Math.cos(enemy.angle - Math.PI/2) * 0.8;
                    dy = Math.sin(enemy.angle - Math.PI/2) * 0.8;
                }
            }
            movePlayer(enemy, dx, dy);
            if (distToPlayer < 600 && Math.abs(Math.atan2(player.y - enemy.y, player.x - enemy.x) - enemy.angle) < 0.2) {
                shoot(enemy, player.x, player.y, true);
            }
            enemy.timer++;
        }

        // ===== Update =====
        function update() {
            if (gameState !== STATE.PLAYING) return;

            if (player.cooldown > 0) player.cooldown--;
            if (enemy.cooldown > 0) enemy.cooldown--;

            let dx = 0, dy = 0;
            if (keys.w) dy -= player.speed;
            if (keys.s) dy += player.speed;
            if (keys.a) dx -= player.speed;
            if (keys.d) dx += player.speed;
            if (joystickActive) {
                const mag = Math.hypot(joystickDX, joystickDY);
                if (mag > 0.1) {
                    const normDX = joystickDX / mag;
                    const normDY = joystickDY / mag;
                    const speed = Math.min(mag, 1) * player.speed;
                    dx += normDX * speed;
                    dy += normDY * speed;
                }
            }
            if (dx !== 0 || dy !== 0) {
                const len = Math.hypot(dx, dy);
                dx = dx / len * Math.min(len, player.speed);
                dy = dy / len * Math.min(len, player.speed);
                movePlayer(player, dx, dy);
            }

            // Aim with mouse or auto-aim for touch
            if (touchFire) {
                const targetX = enemy.alive ? enemy.x : mouseX;
                const targetY = enemy.alive ? enemy.y : mouseY;
                player.angle = Math.atan2(targetY - player.y, targetX - player.x);
                if (player.alive) {
                    shoot(player, targetX, targetY, false);
                }
            } else {
                player.angle = Math.atan2(mouseY - player.y, mouseX - player.x);
                // Mouse shooting: if mouseDown, shoot at mouse position (or enemy if you want auto-aim)
                if (mouseDown && player.alive) {
                    shoot(player, mouseX, mouseY, false);
                }
            }

            updateAI();

            for (let b of bullets) {
                if (!b.alive) continue;
                b.x += b.vx;
                b.y += b.vy;
                if (b.x < 0 || b.x > W || b.y < 0 || b.y > H) { b.alive = false; continue; }
                let hitObstacle = false;
                for (let o of obstacles) {
                    if (b.x >= o.x && b.x <= o.x + o.w && b.y >= o.y && b.y <= o.y + o.h) {
                        hitObstacle = true;
                        break;
                    }
                }
                if (hitObstacle) { b.alive = false; continue; }
                if (!b.isEnemy && b.alive && enemy.alive) {
                    if (dist(b.x, b.y, enemy.x, enemy.y) < enemy.radius + b.radius) {
                        enemy.health -= 35;
                        b.alive = false;
                        if (enemy.health <= 0) { enemy.health = 0; enemy.alive = false; }
                        continue;
                    }
                }
                if (b.isEnemy && b.alive && player.alive) {
                    if (dist(b.x, b.y, player.x, player.y) < player.radius + b.radius) {
                        player.health -= 35;
                        b.alive = false;
                        if (player.health <= 0) { player.health = 0; player.alive = false; }
                        continue;
                    }
                }
            }
            bullets = bullets.filter(b => b.alive);

            hudPlayerHP.textContent = Math.ceil(player.health);
            hudEnemyHP.textContent = Math.ceil(enemy.health);
            hudTimer.textContent = Math.ceil(matchTime);

            if (!player.alive || !enemy.alive || matchTime <= 0) {
                gameState = STATE.GAMEOVER;
                clearInterval(matchTimerInterval);
                if (matchTime <= 0 && player.alive && enemy.alive) {
                    gameOverWinner = 'timeout';
                } else if (!player.alive) {
                    gameOverWinner = 'enemy';
                } else if (!enemy.alive) {
                    gameOverWinner = 'player';
                } else {
                    gameOverWinner = 'draw';
                }
                showGameOver();
            }
        }

        // ===== Draw =====
        function draw() {
            ctx.clearRect(0, 0, W, H);

            ctx.strokeStyle = '#1a1a3a';
            ctx.lineWidth = 1;
            for (let i = 0; i < W; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, H);
                ctx.stroke();
            }
            for (let i = 0; i < H; i += 40) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(W, i);
                ctx.stroke();
            }

            ctx.fillStyle = '#2a2a5a';
            ctx.shadowColor = '#4a4a8a';
            ctx.shadowBlur = 10;
            for (let o of obstacles) {
                ctx.fillRect(o.x, o.y, o.w, o.h);
            }
            ctx.shadowBlur = 0;

            for (let b of bullets) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = b.isEnemy ? '#ff6666' : '#66ff66';
                ctx.shadowColor = b.isEnemy ? '#ff0000' : '#00ff00';
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            function drawMech(p, color) {
                if (!p.alive) return;
                ctx.save();
                ctx.translate(p.x, p.y);
                const grad = ctx.createRadialGradient(0, 0, 5, 0, 0, p.radius);
                grad.addColorStop(0, color);
                grad.addColorStop(1, '#1a1a2a');
                ctx.fillStyle = grad;
                ctx.shadowColor = color;
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.rotate(p.angle);
                ctx.fillStyle = '#888';
                ctx.fillRect(p.radius - 5, -4, 30, 8);
                ctx.fillStyle = '#aaa';
                ctx.fillRect(p.radius + 20, -2, 10, 4);
                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.arc(p.radius - 2, 0, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                const barW = 50;
                const barH = 6;
                const barX = p.x - barW/2;
                const barY = p.y - p.radius - 18;
                ctx.fillStyle = '#333';
                ctx.fillRect(barX, barY, barW, barH);
                const healthPct = p.health / p.maxHealth;
                ctx.fillStyle = healthPct > 0.5 ? '#44ff44' : '#ff4444';
                ctx.fillRect(barX, barY, barW * healthPct, barH);
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 1;
                ctx.strokeRect(barX, barY, barW, barH);
            }

            drawMech(player, '#44aaff');
            drawMech(enemy, '#ff6644');

            // Crosshair (only if not touch firing)
            if (!touchFire) {
                ctx.strokeStyle = '#ff4444';
                ctx.lineWidth = 2;
                const cx = mouseX, cy = mouseY;
                const size = 12;
                ctx.beginPath();
                ctx.moveTo(cx - size, cy); ctx.lineTo(cx - 4, cy);
                ctx.moveTo(cx + 4, cy); ctx.lineTo(cx + size, cy);
                ctx.moveTo(cx, cy - size); ctx.lineTo(cx, cy - 4);
                ctx.moveTo(cx, cy + 4); ctx.lineTo(cx, cy + size);
                ctx.stroke();
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.beginPath();
                ctx.arc(cx, cy, 12, 0, Math.PI*2);
                ctx.stroke();
            }

            if (gameState === STATE.COUNTDOWN) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#ffffff';
                ctx.font = '80px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(countdown > 0 ? countdown : 'GO!', W/2, H/2);
            }
        }

        function showGameOver() {
            gameOverMenu.classList.add('show');
            controlsOverlay.classList.remove('active');
            let title = '', sub = '', color = '#fff';
            if (gameOverWinner === 'player') {
                title = '🏆 YOU WIN!';
                sub = 'You eliminated the enemy!';
                color = '#44ff44';
            } else if (gameOverWinner === 'enemy') {
                title = '💀 YOU LOSE';
                sub = 'Enemy eliminated you.';
                color = '#ff4444';
            } else if (gameOverWinner === 'timeout') {
                if (player.health > enemy.health) {
                    title = '🏆 YOU WIN!';
                    sub = 'More health when time ran out.';
                    color = '#44ff44';
                } else if (enemy.health > player.health) {
                    title = '💀 YOU LOSE';
                    sub = 'Enemy had more health.';
                    color = '#ff4444';
                } else {
                    title = '🤝 DRAW';
                    sub = 'Equal health at time end.';
                    color = '#ffcc44';
                }
            } else {
                title = '🤝 DRAW';
                sub = 'Match ended.';
                color = '#ffcc44';
            }
            gameOverTitle.textContent = title;
            gameOverTitle.style.color = color;
            gameOverSub.textContent = sub;
        }

        function hideGameOver() {
            gameOverMenu.classList.remove('show');
        }

        function resetToMenu() {
            hideGameOver();
            gameState = STATE.MENU;
            menu.classList.remove('hidden');
            controlsOverlay.classList.remove('active');
            clearInterval(matchTimerInterval);
            player.health = player.maxHealth;
            player.alive = true;
            player.x = 150; player.y = 300;
            enemy.health = enemy.maxHealth;
            enemy.alive = true;
            enemy.x = 750; enemy.y = 300;
            bullets = [];
            matchTime = 60;
            hudTimer.textContent = '60';
            hudPlayerHP.textContent = '100';
            hudEnemyHP.textContent = '100';
            mouseDown = false;
            touchFire = false;
            joystickActive = false;
            joystickDX = 0; joystickDY = 0;
            moveJoystickThumb.style.transform = 'translate(-50%, -50%)';
        }

        function startGame() {
            menu.classList.add('hidden');
            controlsOverlay.classList.add('active');
            hideGameOver();
            player.health = player.maxHealth;
            player.alive = true;
            player.x = 150; player.y = 300;
            enemy.health = enemy.maxHealth;
            enemy.alive = true;
            enemy.x = 750; enemy.y = 300;
            bullets = [];
            matchTime = 60;
            hudTimer.textContent = '60';
            hudPlayerHP.textContent = '100';
            hudEnemyHP.textContent = '100';
            mouseDown = false;
            touchFire = false;
            joystickActive = false;
            joystickDX = 0; joystickDY = 0;
            moveJoystickThumb.style.transform = 'translate(-50%, -50%)';

            gameState = STATE.COUNTDOWN;
            countdown = 3;
            const interval = setInterval(() => {
                countdown--;
                if (countdown < 0) {
                    clearInterval(interval);
                    gameState = STATE.PLAYING;
                    matchTimerInterval = setInterval(() => {
                        matchTime--;
                        if (matchTime <= 0) {
                            matchTime = 0;
                            // game over triggered in update
                        }
                    }, 1000);
                }
            }, 1000);
        }

        // ===== Event Listeners =====

        // Keyboard
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = true;
                e.preventDefault();
            }
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = false;
                e.preventDefault();
            }
        });

        // Mouse (canvas)
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            mouseX = (e.clientX - rect.left) * scaleX;
            mouseY = (e.clientY - rect.top) * scaleY;
            mouseX = Math.max(0, Math.min(W, mouseX));
            mouseY = Math.max(0, Math.min(H, mouseY));
        });
        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                mouseDown = true;
                e.preventDefault();
            }
        });
        canvas.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                mouseDown = false;
                e.preventDefault();
            }
        });
        canvas.addEventListener('mouseleave', () => {
            mouseDown = false;
        });
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // Touch joystick
        function handleJoystickStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            if (!touch) return;
            const rect = moveJoystickBase.getBoundingClientRect();
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;
            const dx = touch.clientX - cx;
            const dy = touch.clientY - cy;
            const maxRadius = rect.width/2;
            const mag = Math.hypot(dx, dy);
            const clampedMag = Math.min(mag, maxRadius);
            const angle = Math.atan2(dy, dx);
            const thumbX = clampedMag * Math.cos(angle);
            const thumbY = clampedMag * Math.sin(angle);
            moveJoystickThumb.style.transform = `translate(${thumbX - 25}px, ${thumbY - 25}px)`;
            joystickActive = true;
            joystickDX = dx / maxRadius;
            joystickDY = dy / maxRadius;
            const clamp = (v) => Math.min(1, Math.max(-1, v));
            joystickDX = clamp(joystickDX);
            joystickDY = clamp(joystickDY);
        }

        function handleJoystickMove(e) {
            e.preventDefault();
            const touch = e.touches[0];
            if (!touch) return;
            const rect = moveJoystickBase.getBoundingClientRect();
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;
            const dx = touch.clientX - cx;
            const dy = touch.clientY - cy;
            const maxRadius = rect.width/2;
            const mag = Math.hypot(dx, dy);
            const clampedMag = Math.min(mag, maxRadius);
            const angle = Math.atan2(dy, dx);
            const thumbX = clampedMag * Math.cos(angle);
            const thumbY = clampedMag * Math.sin(angle);
            moveJoystickThumb.style.transform = `translate(${thumbX - 25}px, ${thumbY - 25}px)`;
            joystickActive = true;
            joystickDX = dx / maxRadius;
            joystickDY = dy / maxRadius;
            const clamp = (v) => Math.min(1, Math.max(-1, v));
            joystickDX = clamp(joystickDX);
            joystickDY = clamp(joystickDY);
        }

        function handleJoystickEnd(e) {
            e.preventDefault();
            moveJoystickThumb.style.transform = 'translate(-50%, -50%)';
            joystickActive = false;
            joystickDX = 0;
            joystickDY = 0;
        }

        moveJoystickArea.addEventListener('touchstart', handleJoystickStart);
        moveJoystickArea.addEventListener('touchmove', handleJoystickMove);
        moveJoystickArea.addEventListener('touchend', handleJoystickEnd);
        moveJoystickArea.addEventListener('touchcancel', handleJoystickEnd);

        // Fire button
        fireBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchFire = true;
            if (enemy.alive) {
                player.angle = Math.atan2(enemy.y - player.y, enemy.x - player.x);
            }
        });
        fireBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            touchFire = false;
        });
        fireBtn.addEventListener('touchcancel', (e) => {
            touchFire = false;
        });
        // Also allow mouse click on fire button for desktop touchpad
        fireBtn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            touchFire = true;
            if (enemy.alive) {
                player.angle = Math.atan2(enemy.y - player.y, enemy.x - player.x);
            }
        });
        fireBtn.addEventListener('mouseup', (e) => {
            e.preventDefault();
            touchFire = false;
        });

        // Settings
        settingsBtn.addEventListener('click', () => {
            settingsPanel.classList.toggle('show');
        });
        settingsBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            settingsPanel.classList.toggle('show');
        });
        settingsCloseBtn.addEventListener('click', () => {
            settingsPanel.classList.remove('show');
        });
        settingsCloseBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            settingsPanel.classList.remove('show');
        });
        resetSettingsBtn.addEventListener('click', resetSettingsToDefault);
        resetSettingsBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            resetSettingsToDefault();
        });

        // Sliders
        function updateSettingFromSlider(slider, key, displayEl) {
            const val = parseFloat(slider.value);
            settings[key] = val;
            displayEl.textContent = val + '%';
            saveSettings();
            applySettingsToControls();
        }
        joySizeSlider.addEventListener('input', () => updateSettingFromSlider(joySizeSlider, 'joySize', joySizeVal));
        fireSizeSlider.addEventListener('input', () => updateSettingFromSlider(fireSizeSlider, 'fireSize', fireSizeVal));
        joyXSlider.addEventListener('input', () => updateSettingFromSlider(joyXSlider, 'joyX', joyXVal));
        joyYSlider.addEventListener('input', () => updateSettingFromSlider(joyYSlider, 'joyY', joyYVal));
        fireXSlider.addEventListener('input', () => updateSettingFromSlider(fireXSlider, 'fireX', fireXVal));
        fireYSlider.addEventListener('input', () => updateSettingFromSlider(fireYSlider, 'fireY', fireYVal));

        // Menu buttons
        playBtn.addEventListener('click', startGame);
        playBtn.addEventListener('touchend', (e) => { e.preventDefault(); startGame(); });
        multiBtn.addEventListener('click', () => {});
        multiBtn.addEventListener('touchend', (e) => { e.preventDefault(); });

        // Game Over return
        gameOverReturnBtn.addEventListener('click', resetToMenu);
        gameOverReturnBtn.addEventListener('touchend', (e) => { e.preventDefault(); resetToMenu(); });

        // ===== Game loop =====
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();

        // Responsive resize: ensure wrapper fills screen properly
        function resizeGame() {
            const wrapper = document.getElementById('gameWrapper');
            const maxWidth = window.innerWidth;
            const maxHeight = window.innerHeight;
            const aspect = 3 / 2;
            let w = maxWidth;
            let h = w / aspect;
            if (h > maxHeight) {
                h = maxHeight;
                w = h * aspect;
            }
            wrapper.style.width = w + 'px';
            wrapper.style.height = h + 'px';
        }
        window.addEventListener('resize', resizeGame);
        resizeGame();

        // Load settings and start
        loadSettings();
        resetToMenu();
    </script>
</body>
</html>
