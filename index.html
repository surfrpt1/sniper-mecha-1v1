<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sniper Mecha 1v1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #gameWrapper {
            position: relative;
            width: 900px;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 900 / 600;
            touch-action: none;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            border: 2px solid #2a2a4a;
            border-radius: 12px;
            background: #141428;
            box-shadow: 0 0 40px rgba(0, 100, 255, 0.2);
            touch-action: none;
        }

        /* Menu overlay */
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 30, 0.85);
            backdrop-filter: blur(6px);
            border-radius: 12px;
            z-index: 20;
            pointer-events: auto;
            transition: opacity 0.3s;
        }
        #menu.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #menu h1 {
            font-size: 3.5rem;
            color: #88ccff;
            text-shadow: 0 0 20px #44aaff;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        #menu p {
            color: #8899bb;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        .menu-btn {
            background: #1a2a4a;
            border: 2px solid #3a6a9a;
            color: #ccddff;
            font-size: 1.6rem;
            padding: 14px 48px;
            margin: 10px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            min-width: 240px;
            text-align: center;
            font-weight: 600;
            letter-spacing: 1px;
            touch-action: manipulation;
        }
        .menu-btn:hover {
            background: #2a4a7a;
            border-color: #6a9aff;
            transform: scale(1.03);
        }
        .menu-btn:active {
            transform: scale(0.97);
        }
        .menu-btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #3a3a4a;
        }

        /* Touch controls overlay */
        #controlsOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            touch-action: none;
        }
        #controlsOverlay.active {
            pointer-events: auto;
        }
        .joystick-area {
            position: absolute;
            width: 30%;
            aspect-ratio: 1/1;
            bottom: 8%;
            left: 5%;
            pointer-events: auto;
            touch-action: none;
        }
        .joystick-base {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            position: relative;
            touch-action: none;
        }
        .joystick-thumb {
            width: 45%;
            height: 45%;
            border-radius: 50%;
            background: rgba(100, 180, 255, 0.5);
            border: 2px solid rgba(100, 180, 255, 0.8);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            touch-action: none;
            transition: none;
        }
        .fire-btn {
            position: absolute;
            width: 18%;
            aspect-ratio: 1/1;
            bottom: 10%;
            right: 8%;
            border-radius: 50%;
            background: radial-gradient(circle, #ff6644, #cc2200);
            border: 3px solid #ffaa44;
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: manipulation;
            box-shadow: 0 0 30px rgba(255, 50, 0, 0.5);
            cursor: pointer;
            text-shadow: 0 0 10px rgba(255,255,200,0.8);
            user-select: none;
        }
        .fire-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 50px rgba(255, 50, 0, 0.8);
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #aac;
            font-size: 1rem;
            font-family: monospace;
            z-index: 15;
            pointer-events: none;
            text-shadow: 0 0 10px #000;
            line-height: 1.6;
        }
        #hud .timer {
            font-size: 1.6rem;
            color: #ffcc44;
        }

        /* Responsive scaling */
        @media (max-width: 600px) {
            #menu h1 { font-size: 2.4rem; }
            .menu-btn { font-size: 1.2rem; padding: 12px 28px; min-width: 160px; }
            .fire-btn { font-size: 1.2rem; }
            #hud { font-size: 0.8rem; }
            #hud .timer { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <canvas id="gameCanvas" width="900" height="600"></canvas>

        <!-- Menu -->
        <div id="menu">
            <h1>🔫 SNIPER MECHA</h1>
            <p>1v1 · BGMI WOW Style</p>
            <button class="menu-btn" id="playBtn">▶ Play vs Bot</button>
            <button class="menu-btn disabled" id="multiBtn">🌐 Online (coming soon)</button>
        </div>

        <!-- HUD -->
        <div id="hud">
            <div>HP: <span id="hudPlayerHP">100</span></div>
            <div>Enemy: <span id="hudEnemyHP">100</span></div>
            <div class="timer">⏱ <span id="hudTimer">60</span>s</div>
        </div>

        <!-- Touch Controls -->
        <div id="controlsOverlay">
            <div class="joystick-area" id="moveJoystickArea">
                <div class="joystick-base" id="moveJoystickBase">
                    <div class="joystick-thumb" id="moveJoystickThumb"></div>
                </div>
            </div>
            <div class="fire-btn" id="fireBtn">🔥</div>
        </div>
    </div>

    <script>
        // ===== DOM refs =====
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu');
        const playBtn = document.getElementById('playBtn');
        const multiBtn = document.getElementById('multiBtn');
        const hudPlayerHP = document.getElementById('hudPlayerHP');
        const hudEnemyHP = document.getElementById('hudEnemyHP');
        const hudTimer = document.getElementById('hudTimer');
        const controlsOverlay = document.getElementById('controlsOverlay');
        const moveJoystickArea = document.getElementById('moveJoystickArea');
        const moveJoystickBase = document.getElementById('moveJoystickBase');
        const moveJoystickThumb = document.getElementById('moveJoystickThumb');
        const fireBtn = document.getElementById('fireBtn');

        // ===== Canvas dimensions (logical) =====
        const W = 900, H = 600;

        // ===== Game state =====
        const STATE = { MENU: 0, COUNTDOWN: 1, PLAYING: 2, GAMEOVER: 3 };
        let gameState = STATE.MENU;
        let countdown = 3; // 3,2,1
        let matchTime = 60; // seconds
        let matchTimerInterval = null;

        // ===== Players =====
        const player = {
            x: 150, y: 300,
            radius: 20,
            speed: 3.5,
            health: 100,
            maxHealth: 100,
            angle: 0,
            cooldown: 0,
            shootCooldown: 40,
            alive: true
        };
        const enemy = {
            x: 750, y: 300,
            radius: 20,
            speed: 2.0,
            health: 100,
            maxHealth: 100,
            angle: 0,
            cooldown: 0,
            shootCooldown: 50,
            alive: true,
            state: 'idle',
            timer: 0
        };

        let bullets = [];
        const bulletSpeed = 8;
        const bulletRadius = 4;

        const obstacles = [
            { x: 350, y: 200, w: 60, h: 40 },
            { x: 500, y: 380, w: 40, h: 60 },
            { x: 200, y: 450, w: 80, h: 30 },
            { x: 650, y: 100, w: 30, h: 80 },
            { x: 450, y: 280, w: 20, h: 20 }
        ];

        // ===== Input =====
        const keys = { w: false, a: false, s: false, d: false };
        let mouseX = player.x, mouseY = player.y;
        let mouseDown = false;

        // Touch joystick
        let joystickActive = false;
        let joystickDX = 0, joystickDY = 0;
        let touchFire = false;

        // ===== Helpers =====
        function dist(x1, y1, x2, y2) {
            return Math.hypot(x2 - x1, y2 - y1);
        }

        function collidesWithObstacles(x, y, r) {
            for (let o of obstacles) {
                const closestX = Math.max(o.x, Math.min(x, o.x + o.w));
                const closestY = Math.max(o.y, Math.min(y, o.y + o.h));
                if (dist(x, y, closestX, closestY) < r) return true;
            }
            return false;
        }

        function movePlayer(p, dx, dy) {
            let nx = p.x + dx;
            let ny = p.y + dy;
            if (nx - p.radius < 0) nx = p.radius;
            if (nx + p.radius > W) nx = W - p.radius;
            if (ny - p.radius < 0) ny = p.radius;
            if (ny + p.radius > H) ny = H - p.radius;
            if (!collidesWithObstacles(nx, ny, p.radius)) {
                p.x = nx;
                p.y = ny;
            } else {
                if (!collidesWithObstacles(nx, p.y, p.radius)) {
                    p.x = nx;
                } else if (!collidesWithObstacles(p.x, ny, p.radius)) {
                    p.y = ny;
                }
            }
        }

        function shoot(shooter, targetX, targetY, isEnemy = false) {
            if (shooter.cooldown > 0) return;
            const angle = Math.atan2(targetY - shooter.y, targetX - shooter.x);
            const speed = bulletSpeed;
            bullets.push({
                x: shooter.x + Math.cos(angle) * (shooter.radius + 4),
                y: shooter.y + Math.sin(angle) * (shooter.radius + 4),
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: bulletRadius,
                isEnemy: isEnemy,
                alive: true
            });
            shooter.cooldown = shooter.shootCooldown;
        }

        // ===== AI =====
        function updateAI() {
            if (!enemy.alive) return;
            enemy.angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
            const distToPlayer = dist(enemy.x, enemy.y, player.x, player.y);
            if (distToPlayer > 500) enemy.state = 'chase';
            else if (distToPlayer < 250) enemy.state = 'retreat';
            else enemy.state = 'idle';

            let dx = 0, dy = 0;
            if (enemy.state === 'chase') {
                dx = Math.cos(enemy.angle) * enemy.speed;
                dy = Math.sin(enemy.angle) * enemy.speed;
            } else if (enemy.state === 'retreat') {
                dx = -Math.cos(enemy.angle) * enemy.speed * 0.7;
                dy = -Math.sin(enemy.angle) * enemy.speed * 0.7;
            } else {
                if (enemy.timer % 120 < 60) {
                    dx = Math.cos(enemy.angle + Math.PI/2) * 0.8;
                    dy = Math.sin(enemy.angle + Math.PI/2) * 0.8;
                } else {
                    dx = Math.cos(enemy.angle - Math.PI/2) * 0.8;
                    dy = Math.sin(enemy.angle - Math.PI/2) * 0.8;
                }
            }
            movePlayer(enemy, dx, dy);
            if (distToPlayer < 600 && Math.abs(Math.atan2(player.y - enemy.y, player.x - enemy.x) - enemy.angle) < 0.2) {
                shoot(enemy, player.x, player.y, true);
            }
            enemy.timer++;
        }

        // ===== Update =====
        function update() {
            if (gameState !== STATE.PLAYING) return;

            if (player.cooldown > 0) player.cooldown--;
            if (enemy.cooldown > 0) enemy.cooldown--;

            // Player movement (keyboard)
            let dx = 0, dy = 0;
            if (keys.w) dy -= player.speed;
            if (keys.s) dy += player.speed;
            if (keys.a) dx -= player.speed;
            if (keys.d) dx += player.speed;
            // Joystick
            if (joystickActive) {
                const mag = Math.hypot(joystickDX, joystickDY);
                if (mag > 0.1) {
                    const normDX = joystickDX / mag;
                    const normDY = joystickDY / mag;
                    const speed = Math.min(mag, 1) * player.speed;
                    dx += normDX * speed;
                    dy += normDY * speed;
                }
            }
            if (dx !== 0 || dy !== 0) {
                const len = Math.hypot(dx, dy);
                dx = dx / len * Math.min(len, player.speed);
                dy = dy / len * Math.min(len, player.speed);
                movePlayer(player, dx, dy);
            }

            // Aim (mouse or auto-aim for touch)
            if (mouseDown || touchFire) {
                // Aim at enemy for auto-aim
                const targetX = enemy.alive ? enemy.x : mouseX;
                const targetY = enemy.alive ? enemy.y : mouseY;
                player.angle = Math.atan2(targetY - player.y, targetX - player.x);
                if (player.alive) {
                    shoot(player, targetX, targetY, false);
                }
            } else {
                // Use mouse aim if not firing
                player.angle = Math.atan2(mouseY - player.y, mouseX - player.x);
            }

            updateAI();

            // Bullets
            for (let b of bullets) {
                if (!b.alive) continue;
                b.x += b.vx;
                b.y += b.vy;
                if (b.x < 0 || b.x > W || b.y < 0 || b.y > H) { b.alive = false; continue; }
                let hitObstacle = false;
                for (let o of obstacles) {
                    if (b.x >= o.x && b.x <= o.x + o.w && b.y >= o.y && b.y <= o.y + o.h) {
                        hitObstacle = true;
                        break;
                    }
                }
                if (hitObstacle) { b.alive = false; continue; }
                if (!b.isEnemy && b.alive && enemy.alive) {
                    if (dist(b.x, b.y, enemy.x, enemy.y) < enemy.radius + b.radius) {
                        enemy.health -= 35;
                        b.alive = false;
                        if (enemy.health <= 0) { enemy.health = 0; enemy.alive = false; }
                        continue;
                    }
                }
                if (b.isEnemy && b.alive && player.alive) {
                    if (dist(b.x, b.y, player.x, player.y) < player.radius + b.radius) {
                        player.health -= 35;
                        b.alive = false;
                        if (player.health <= 0) { player.health = 0; player.alive = false; }
                        continue;
                    }
                }
            }
            bullets = bullets.filter(b => b.alive);

            // Update HUD
            hudPlayerHP.textContent = Math.ceil(player.health);
            hudEnemyHP.textContent = Math.ceil(enemy.health);
            hudTimer.textContent = Math.ceil(matchTime);

            // Check win/lose
            if (!player.alive || !enemy.alive || matchTime <= 0) {
                gameState = STATE.GAMEOVER;
                clearInterval(matchTimerInterval);
                controlsOverlay.classList.remove('active');
                // Show game over after short delay
                setTimeout(() => {
                    showGameOver();
                }, 300);
            }
        }

        // ===== Draw =====
        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Grid
            ctx.strokeStyle = '#1a1a3a';
            ctx.lineWidth = 1;
            for (let i = 0; i < W; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, H);
                ctx.stroke();
            }
            for (let i = 0; i < H; i += 40) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(W, i);
                ctx.stroke();
            }

            // Obstacles
            ctx.fillStyle = '#2a2a5a';
            ctx.shadowColor = '#4a4a8a';
            ctx.shadowBlur = 10;
            for (let o of obstacles) {
                ctx.fillRect(o.x, o.y, o.w, o.h);
            }
            ctx.shadowBlur = 0;

            // Bullets
            for (let b of bullets) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = b.isEnemy ? '#ff6666' : '#66ff66';
                ctx.shadowColor = b.isEnemy ? '#ff0000' : '#00ff00';
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            function drawMech(p, color) {
                if (!p.alive) return;
                ctx.save();
                ctx.translate(p.x, p.y);
                const grad = ctx.createRadialGradient(0, 0, 5, 0, 0, p.radius);
                grad.addColorStop(0, color);
                grad.addColorStop(1, '#1a1a2a');
                ctx.fillStyle = grad;
                ctx.shadowColor = color;
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.rotate(p.angle);
                ctx.fillStyle = '#888';
                ctx.fillRect(p.radius - 5, -4, 30, 8);
                ctx.fillStyle = '#aaa';
                ctx.fillRect(p.radius + 20, -2, 10, 4);
                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.arc(p.radius - 2, 0, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Health bar
                const barW = 50;
                const barH = 6;
                const barX = p.x - barW/2;
                const barY = p.y - p.radius - 18;
                ctx.fillStyle = '#333';
                ctx.fillRect(barX, barY, barW, barH);
                const healthPct = p.health / p.maxHealth;
                ctx.fillStyle = healthPct > 0.5 ? '#44ff44' : '#ff4444';
                ctx.fillRect(barX, barY, barW * healthPct, barH);
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 1;
                ctx.strokeRect(barX, barY, barW, barH);
            }

            drawMech(player, '#44aaff');
            drawMech(enemy, '#ff6644');

            // Crosshair (only if not touch firing)
            if (!touchFire) {
                ctx.strokeStyle = '#ff4444';
                ctx.lineWidth = 2;
                const cx = mouseX, cy = mouseY;
                const size = 12;
                ctx.beginPath();
                ctx.moveTo(cx - size, cy); ctx.lineTo(cx - 4, cy);
                ctx.moveTo(cx + 4, cy); ctx.lineTo(cx + size, cy);
                ctx.moveTo(cx, cy - size); ctx.lineTo(cx, cy - 4);
                ctx.moveTo(cx, cy + 4); ctx.lineTo(cx, cy + size);
                ctx.stroke();
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.beginPath();
                ctx.arc(cx, cy, 12, 0, Math.PI*2);
                ctx.stroke();
            }

            // Countdown overlay
            if (gameState === STATE.COUNTDOWN) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#ffffff';
                ctx.font = '80px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(countdown > 0 ? countdown : 'GO!', W/2, H/2);
            }

            // Game over overlay (handled by showGameOver)
        }

        function showGameOver() {
            const winner = player.health > enemy.health ? 'You' : (enemy.health > player.health ? 'Enemy' : 'Draw');
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = winner === 'You' ? '#44ff44' : '#ff4444';
            ctx.font = '60px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(winner === 'You' ? '🏆 YOU WIN!' : (winner === 'Draw' ? '🤝 DRAW' : '💀 YOU LOSE'), W/2, H/2 - 40);
            ctx.fillStyle = '#aac';
            ctx.font = '28px sans-serif';
            ctx.fillText('Tap anywhere to continue', W/2, H/2 + 60);
            // Set up tap to return to menu
            const handler = () => {
                document.removeEventListener('click', handler);
                document.removeEventListener('touchstart', handler);
                resetToMenu();
            };
            document.addEventListener('click', handler);
            document.addEventListener('touchstart', handler);
        }

        function resetToMenu() {
            // Reset game state
            gameState = STATE.MENU;
            menu.classList.remove('hidden');
            controlsOverlay.classList.remove('active');
            clearInterval(matchTimerInterval);
            // Reset players
            player.health = player.maxHealth;
            player.alive = true;
            player.x = 150; player.y = 300;
            enemy.health = enemy.maxHealth;
            enemy.alive = true;
            enemy.x = 750; enemy.y = 300;
            bullets = [];
            matchTime = 60;
            hudTimer.textContent = '60';
            hudPlayerHP.textContent = '100';
            hudEnemyHP.textContent = '100';
            mouseDown = false;
            touchFire = false;
            joystickActive = false;
            joystickDX = 0; joystickDY = 0;
            moveJoystickThumb.style.transform = 'translate(-50%, -50%)';
        }

        function startGame() {
            menu.classList.add('hidden');
            controlsOverlay.classList.add('active');
            // Reset game
            player.health = player.maxHealth;
            player.alive = true;
            player.x = 150; player.y = 300;
            enemy.health = enemy.maxHealth;
            enemy.alive = true;
            enemy.x = 750; enemy.y = 300;
            bullets = [];
            matchTime = 60;
            hudTimer.textContent = '60';
            hudPlayerHP.textContent = '100';
            hudEnemyHP.textContent = '100';
            mouseDown = false;
            touchFire = false;
            joystickActive = false;
            joystickDX = 0; joystickDY = 0;
            moveJoystickThumb.style.transform = 'translate(-50%, -50%)';

            // Countdown
            gameState = STATE.COUNTDOWN;
            countdown = 3;
            const interval = setInterval(() => {
                countdown--;
                if (countdown < 0) {
                    clearInterval(interval);
                    gameState = STATE.PLAYING;
                    // Start match timer
                    matchTimerInterval = setInterval(() => {
                        matchTime--;
                        if (matchTime <= 0) {
                            matchTime = 0;
                            // Game over will be triggered in update
                        }
                    }, 1000);
                }
            }, 1000);
        }

        // ===== Event Listeners =====

        // Keyboard
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = true;
                e.preventDefault();
            }
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = false;
                e.preventDefault();
            }
        });

        // Mouse
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            mouseX = (e.clientX - rect.left) * scaleX;
            mouseY = (e.clientY - rect.top) * scaleY;
            mouseX = Math.max(0, Math.min(W, mouseX));
            mouseY = Math.max(0, Math.min(H, mouseY));
        });
        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                mouseDown = true;
                e.preventDefault();
            }
        });
        canvas.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                mouseDown = false;
                e.preventDefault();
            }
        });
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // Touch joystick
        function handleJoystickStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            if (!touch) return;
            const rect = moveJoystickBase.getBoundingClientRect();
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;
            const dx = touch.clientX - cx;
            const dy = touch.clientY - cy;
            const maxRadius = rect.width/2;
            const mag = Math.hypot(dx, dy);
            const clampedMag = Math.min(mag, maxRadius);
            const angle = Math.atan2(dy, dx);
            const thumbX = clampedMag * Math.cos(angle);
            const thumbY = clampedMag * Math.sin(angle);
            moveJoystickThumb.style.transform = `translate(${thumbX - 25}px, ${thumbY - 25}px)`;
            joystickActive = true;
            joystickDX = dx / maxRadius;
            joystickDY = dy / maxRadius;
            const clamp = (v) => Math.min(1, Math.max(-1, v));
            joystickDX = clamp(joystickDX);
            joystickDY = clamp(joystickDY);
        }

        function handleJoystickMove(e) {
            e.preventDefault();
            const touch = e.touches[0];
            if (!touch) return;
            const rect = moveJoystickBase.getBoundingClientRect();
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;
            const dx = touch.clientX - cx;
            const dy = touch.clientY - cy;
            const maxRadius = rect.width/2;
            const mag = Math.hypot(dx, dy);
            const clampedMag = Math.min(mag, maxRadius);
            const angle = Math.atan2(dy, dx);
            const thumbX = clampedMag * Math.cos(angle);
            const thumbY = clampedMag * Math.sin(angle);
            moveJoystickThumb.style.transform = `translate(${thumbX - 25}px, ${thumbY - 25}px)`;
            joystickActive = true;
            joystickDX = dx / maxRadius;
            joystickDY = dy / maxRadius;
            const clamp = (v) => Math.min(1, Math.max(-1, v));
            joystickDX = clamp(joystickDX);
            joystickDY = clamp(joystickDY);
        }

        function handleJoystickEnd(e) {
            e.preventDefault();
            moveJoystickThumb.style.transform = 'translate(-50%, -50%)';
            joystickActive = false;
            joystickDX = 0;
            joystickDY = 0;
        }

        moveJoystickArea.addEventListener('touchstart', handleJoystickStart);
        moveJoystickArea.addEventListener('touchmove', handleJoystickMove);
        moveJoystickArea.addEventListener('touchend', handleJoystickEnd);
        moveJoystickArea.addEventListener('touchcancel', handleJoystickEnd);

        // Fire button
        fireBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchFire = true;
            // Auto-aim at enemy if alive
            if (enemy.alive) {
                player.angle = Math.atan2(enemy.y - player.y, enemy.x - player.x);
            }
        });
        fireBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            touchFire = false;
        });
        fireBtn.addEventListener('touchcancel', (e) => {
            touchFire = false;
        });
        // Also mouse click on fire button (for desktop touchpad)
        fireBtn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            touchFire = true;
            if (enemy.alive) {
                player.angle = Math.atan2(enemy.y - player.y, enemy.x - player.x);
            }
        });
        fireBtn.addEventListener('mouseup', (e) => {
            e.preventDefault();
            touchFire = false;
        });

        // Menu buttons
        playBtn.addEventListener('click', startGame);
        playBtn.addEventListener('touchend', (e) => { e.preventDefault(); startGame(); });
        multiBtn.addEventListener('click', () => {});
        multiBtn.addEventListener('touchend', (e) => { e.preventDefault(); });

        // ===== Game loop =====
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();

        // Handle resize to keep canvas aspect ratio
        function resizeGame() {
            const wrapper = document.getElementById('gameWrapper');
            const maxWidth = window.innerWidth;
            const maxHeight = window.innerHeight;
            const aspect = 900 / 600;
            let w = maxWidth;
            let h = w / aspect;
            if (h > maxHeight) {
                h = maxHeight;
                w = h * aspect;
            }
            wrapper.style.width = w + 'px';
            wrapper.style.height = h + 'px';
        }
        window.addEventListener('resize', resizeGame);
        resizeGame();

        // Start with menu visible
        resetToMenu();
    </script>
</body>
</html>
