<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sniper Mecha 1v1 - Multiplayer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-touch-callout: none; touch-action: none; }
        body {
            background: #203a5a;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #gameWrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(180deg, #2a5a8a 0%, #3a7aba 45%, #4a8aca 100%);
        }
        #three-canvas { width: 100%; height: 100%; display: block; }

        /* Overlays */
        #menu, #lobby, #gameOverMenu {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 30, 0.85);
            backdrop-filter: blur(6px);
            z-index: 20;
            pointer-events: auto;
            transition: opacity 0.3s;
        }
        #menu.hidden, #lobby.hidden, #gameOverMenu.hidden { opacity: 0; pointer-events: none; display: none; }
        #menu h1, #lobby h1, #gameOverMenu h1 {
            font-size: clamp(2rem, 8vw, 4rem);
            color: #ffffff;
            text-shadow: 0 0 20px #44aaff, 0 2px 0 #1a3a5a;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        #menu p, #lobby p, #gameOverMenu p, #gameOverMenu .sub {
            color: #eaf4ff;
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            margin-bottom: 20px;
            text-align: center;
            padding: 0 16px;
        }
        /* Weapon + skin select */
        #weaponBarMenu, #weaponBar, #skinBarMenu {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 8px 0;
            flex-wrap: wrap;
        }
        #weaponBar {
            position: absolute;
            bottom: 12px; left: 50%;
            transform: translateX(-50%);
            z-index: 16;
            pointer-events: auto;
            background: rgba(10,30,50,0.55);
            padding: 6px 8px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.25);
        }
        #weaponBar.hidden { display: none; }
        .weapon-btn {
            border: 2px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.12);
            color: #fff;
            border-radius: 12px;
            padding: 6px 10px;
            font-size: 1.1rem;
            cursor: pointer;
            text-align: center;
            line-height: 1.1;
            min-width: 64px;
            touch-action: manipulation;
        }
        .weapon-btn small { display: block; font-size: 0.6rem; opacity: 0.9; }
        .weapon-btn.active { border-color: #ffdd44; background: rgba(255,200,50,0.3); transform: scale(1.05); }
        .skin-btn {
            border: 2px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.12);
            color: #fff;
            border-radius: 12px;
            padding: 6px 8px;
            font-size: 1.3rem;
            cursor: pointer;
            text-align: center;
            line-height: 1.1;
            min-width: 56px;
            touch-action: manipulation;
        }
        .skin-btn small { display: block; font-size: 0.58rem; opacity: 0.9; }
        .skin-btn.active { border-color: #7fff9f; background: rgba(80,255,150,0.25); transform: scale(1.05); }
        .skin-row {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .menu-btn {
            background: #1a2a4a;
            border: 2px solid #3a6a9a;
            color: #ccddff;
            font-size: clamp(1rem, 3vw, 1.4rem);
            padding: 12px 28px;
            margin: 8px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            min-width: 160px;
            text-align: center;
            font-weight: 600;
            letter-spacing: 1px;
            touch-action: manipulation;
        }
        .menu-btn:hover { background: #2a4a7a; border-color: #6a9aff; transform: scale(1.03); }
        .menu-btn:active { transform: scale(0.97); }
        .menu-btn.primary { background: #1a5a2a; border-color: #4aca6a; }
        .menu-btn.primary:hover { background: #2a7a3a; }
        .menu-btn.hidden { display: none; }

        #lobby .room-list {
            width: min(90%, 500px);
            max-height: 32vh;
            overflow-y: auto;
            background: rgba(20,20,40,0.6);
            border-radius: 12px;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #2a2a5a;
        }
        .room-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid #1a1a3a;
            color: #aac;
            cursor: pointer;
            transition: 0.1s;
        }
        .room-item:hover { background: #2a2a5a; }
        .room-item .name { font-weight: bold; color: #88ccff; }
        .room-item .players { color: #8899bb; }
        .room-item .status { font-size: 0.8em; color: #ffcc44; }

        .input-field {
            background: #1a1a2a;
            border: 1px solid #3a5a7a;
            color: #ccddff;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 1rem;
            margin: 5px;
            width: 80%;
            max-width: 300px;
            outline: none;
        }
        .input-field:focus { border-color: #6a9aff; }

        .lobby-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }
        .lobby-actions .menu-btn { min-width: 120px; font-size: 1rem; padding: 10px 20px; }

        /* HUD */
        #hud {
            position: absolute;
            top: 10px; left: 10px;
            color: #ffffff;
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            font-family: monospace;
            z-index: 15;
            pointer-events: none;
            text-shadow: 0 1px 4px #000;
            line-height: 1.6;
            background: rgba(10,40,70,0.6);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.3);
        }
        #hud .timer { font-size: clamp(1rem, 3vw, 1.4rem); color: #ffcc44; }
        #hud .hp-low { color: #ff5555; font-weight: bold; }
        #scores { margin-top: 4px; font-size: 0.85em; color: #88ccff; }

        #killfeed {
            position: absolute;
            top: 10px; left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            pointer-events: none;
            width: max-content;
            max-width: 90vw;
        }
        .kill-entry {
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,100,100,0.3);
            color: #ffccaa;
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 20px;
            animation: fadein 0.2s;
        }
        @keyframes fadein { from { opacity: 0; transform: translateY(-6px);} to { opacity: 1; } }

        #countdown {
            position: absolute;
            top: 35%; left: 50%;
            transform: translate(-50%,-50%);
            font-size: clamp(4rem, 15vw, 8rem);
            font-weight: 900;
            color: #ffcc44;
            text-shadow: 0 0 40px #ff6600, 0 0 80px #ff3300;
            z-index: 18;
            pointer-events: none;
            display: none;
        }
        #countdown.show { display: block; }
        #respawnOverlay {
            position: absolute;
            top: 55%; left: 50%;
            transform: translate(-50%,-50%);
            color: #ff6666;
            font-size: 1.2rem;
            z-index: 16;
            pointer-events: none;
            display: none;
            background: rgba(0,0,0,0.6);
            padding: 8px 20px;
            border-radius: 20px;
        }
        #respawnOverlay.show { display: block; }
        #hitmarker {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            color: #ffff00;
            font-size: 2rem;
            z-index: 16;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
        }
        #vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 14;
            box-shadow: inset 0 0 120px rgba(255,0,0,0);
            transition: box-shadow 0.2s;
        }
        #vignette.hit { box-shadow: inset 0 0 140px rgba(255,0,0,0.7); }

        #settingsBtn {
            position: absolute;
            top: 12px; right: 12px;
            z-index: 16;
            background: rgba(0,0,0,0.5);
            border: 1px solid #3a5a7a;
            color: #ccddff;
            border-radius: 50%;
            width: clamp(28px, 4vw, 36px);
            height: clamp(28px, 4vw, 36px);
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            touch-action: manipulation;
            transition: 0.2s;
        }
        #settingsBtn:hover { background: rgba(30,60,100,0.7); }
        #settingsPanel {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: min(90%, 350px);
            background: rgba(10,10,30,0.95);
            border: 2px solid #3a5a8a;
            border-radius: 20px;
            padding: 24px 20px;
            z-index: 30;
            display: none;
            flex-direction: column;
            gap: 16px;
            backdrop-filter: blur(8px);
            pointer-events: auto;
        }
        #settingsPanel.show { display: flex; }
        #settingsPanel h2 { color: #88ccff; font-size: 1.4rem; text-align: center; }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #aac;
            font-size: 0.95rem;
        }
        .setting-row button {
            background: #2a3a5a;
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            touch-action: manipulation;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .setting-row span { min-width: 40px; text-align: center; color: #88ccff; }
        .settings-close-btn {
            background: #2a3a5a;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
        }

        /* Touch controls — hidden on desktop, shown on touch */
        #controlsOverlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            touch-action: none;
            display: none;
        }
        #controlsOverlay.active { display: block; }
        #controlsOverlay.touch { pointer-events: auto; }
        .joystick-area {
            position: absolute;
            width: 30%;
            aspect-ratio: 1/1;
            max-width: 180px;
            bottom: 8%; left: 5%;
            pointer-events: auto;
            touch-action: none;
        }
        .joystick-base {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.15);
            position: relative;
            touch-action: none;
        }
        .joystick-thumb {
            width: 45%; height: 45%;
            border-radius: 50%;
            background: rgba(100,180,255,0.5);
            border: 2px solid rgba(100,180,255,0.8);
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            touch-action: none;
        }
        #fireThumb {
            width: 42%; height: 42%;
            border-radius: 50%;
            background: rgba(255,255,255,0.55);
            border: 2px solid #fff;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            pointer-events: none;
        }
        .fire-btn {
            position: absolute;
            width: 22%;
            aspect-ratio: 1/1;
            max-width: 130px;
            bottom: 12%; right: 6%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffd27f, #ff7b39 55%, #c22e00);
            border: 3px solid #ffe2a8;
            color: white;
            font-size: clamp(1rem, 3.5vw, 1.6rem);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: none;
            box-shadow: 0 0 30px rgba(255,150,50,0.6);
            cursor: pointer;
            user-select: none;
            overflow: hidden;
        }
        .fire-btn .fire-label { pointer-events: none; text-shadow: 0 1px 3px #000; z-index: 1; }
        .fire-btn:active { transform: scale(0.96); }
        @media (hover:hover) and (pointer:fine) {
            .joystick-area { display: none; }
            .fire-btn { display: none; }
            #controlsOverlay.touch .joystick-area,
            #controlsOverlay.touch .fire-btn { display: flex; }
            #controlsOverlay.touch .joystick-area { display: block; }
        }
    </style>
</head>
<body>
    <div id="gameWrapper">
        <div id="three-canvas"></div>

        <div id="menu">
            <h1>🔫 SNIPER MECHA</h1>
            <p>Multiplayer 1v1 · BGMI WOW Style</p>
            <div id="weaponBarMenu">
                <button class="weapon-btn active" data-w="rifle">🔫<small>Scout</small></button>
                <button class="weapon-btn" data-w="smg">🔥<small>SMG</small></button>
                <button class="weapon-btn" data-w="sniper">🎯<small>Rail</small></button>
            </div>
            <div id="skinBarMenu">
                <button class="skin-btn active" data-s="commando">🪖<small>Commando</small></button>
                <button class="skin-btn" data-s="glacier">❄️<small>Glacier</small></button>
                <button class="skin-btn" data-s="inferno">🎀<small>Valkyrie</small></button>
                <button class="skin-btn" data-s="viper">🌙<small>Nova</small></button>
            </div>
            <button class="menu-btn" id="playBtn">▶ Play vs Bot</button>
            <button class="menu-btn" id="multiBtn">🌐 Online Multiplayer</button>
            <p style="font-size:0.75rem;opacity:0.9">WASD move · Mouse aim · Click shoot · 1/2/3 weapons · Mobile: left stick move, drag 🔥 to aim+fire</p>
        </div>

        <div id="lobby" class="hidden">
            <h1>🌐 Lobby</h1>
            <input class="input-field" id="nameInput" placeholder="Your name" value="Player" maxlength="16" />
            <div class="room-list" id="roomList"></div>
            <div class="lobby-actions">
                <button class="menu-btn" id="createRoomBtn">➕ Create</button>
                <button class="menu-btn primary hidden" id="startGameBtn">▶ Start</button>
                <button class="menu-btn" id="refreshRoomsBtn">🔄 Refresh</button>
                <button class="menu-btn" id="backToMenuBtn">↩ Back</button>
            </div>
            <div style="margin-top:10px;color:#8899bb;font-size:0.9rem;">
                <span id="lobbyStatus">Select or create a room</span>
            </div>
        </div>

        <div id="gameOverMenu" class="hidden">
            <h1 id="gameOverTitle">🏆 YOU WIN!</h1>
            <div class="sub" id="gameOverSub">Match over</div>
            <button class="menu-btn" id="gameOverReturnBtn">↩ Return to Menu</button>
        </div>

        <div id="hud">
            <div>HP: <span id="hudPlayerHP">100</span> · Enemy: <span id="hudEnemyHP">100</span> · <span id="hudWeapon">🔫 Scout</span></div>
            <div id="scores"></div>
            <div class="timer">⏱ <span id="hudTimer">10:00</span></div>
        </div>
        <div id="weaponBar" class="hidden">
            <button class="weapon-btn active" data-w="rifle">🔫<small>Scout</small></button>
            <button class="weapon-btn" data-w="smg">🔥<small>SMG</small></button>
            <button class="weapon-btn" data-w="sniper">🎯<small>Rail</small></button>
        </div>
        <div id="killfeed"></div>
        <div id="countdown"></div>
        <div id="respawnOverlay">💀 Respawning...</div>
        <div id="hitmarker">✕</div>
        <div id="vignette"></div>

        <div id="settingsBtn">⚙</div>
        <div id="settingsPanel">
            <h2>⚙ Controls</h2>
            <div class="setting-row">
                <label>Joystick size</label>
                <button id="joyDec">−</button>
                <span id="joySizeVal">30%</span>
                <button id="joyInc">+</button>
            </div>
            <div class="setting-row">
                <label>Aim button size</label>
                <button id="fireDec">−</button>
                <span id="fireSizeVal">18%</span>
                <button id="fireInc">+</button>
            </div>
            <div class="setting-row">
                <label>Sound</label>
                <button id="soundToggle">🔊</button>
            </div>
            <div class="setting-row" style="justify-content:center">
                <label style="width:100%;text-align:center;margin-bottom:6px">Pilot skin</label>
            </div>
            <div class="skin-row">
                <button class="skin-btn active" data-s="commando">🪖<small>Commando</small></button>
                <button class="skin-btn" data-s="glacier">❄️<small>Glacier</small></button>
                <button class="skin-btn" data-s="inferno">🎀<small>Valkyrie</small></button>
                <button class="skin-btn" data-s="viper">🌙<small>Nova</small></button>
            </div>
            <button class="settings-close-btn" id="settingsMenuBtn" style="background:#7a2a2a">↩ Return to Menu</button>
            <button class="settings-close-btn" id="settingsCloseBtn">Close</button>
        </div>

        <div id="controlsOverlay">
            <div class="joystick-area" id="moveJoystickArea">
                <div class="joystick-base" id="moveJoystickBase">
                    <div class="joystick-thumb" id="moveJoystickThumb"></div>
                </div>
            </div>
            <div class="fire-btn" id="fireBtn"><span class="fire-label">🔥</span><div id="fireThumb"></div></div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "socket.io-client": "https://cdn.socket.io/4.7.5/socket.io.esm.min.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import io from 'socket.io-client';

        // ---------- DOM ----------
        const $ = (id) => document.getElementById(id);
        const container = $('three-canvas');
        const menu = $('menu'), lobby = $('lobby');
        const playBtn = $('playBtn'), multiBtn = $('multiBtn');
        const backToMenuBtn = $('backToMenuBtn');
        const createRoomBtn = $('createRoomBtn'), refreshRoomsBtn = $('refreshRoomsBtn');
        const startGameBtn = $('startGameBtn');
        const roomList = $('roomList'), nameInput = $('nameInput'), lobbyStatus = $('lobbyStatus');
        const gameOverMenu = $('gameOverMenu'), gameOverTitle = $('gameOverTitle'), gameOverSub = $('gameOverSub');
        const gameOverReturnBtn = $('gameOverReturnBtn');
        const hudPlayerHP = $('hudPlayerHP'), hudEnemyHP = $('hudEnemyHP'), hudTimer = $('hudTimer');
        const scoresEl = $('scores'), killfeedEl = $('killfeed');
        const countdownEl = $('countdown'), respawnEl = $('respawnOverlay');
        const hitmarkerEl = $('hitmarker'), vignetteEl = $('vignette');
        const controlsOverlay = $('controlsOverlay');
        const moveJoystickArea = $('moveJoystickArea'), moveJoystickBase = $('moveJoystickBase'), moveJoystickThumb = $('moveJoystickThumb');
        const fireBtn = $('fireBtn'), fireThumb = $('fireThumb');
        const settingsBtn = $('settingsBtn'), settingsPanel = $('settingsPanel'), settingsCloseBtn = $('settingsCloseBtn');
        const settingsMenuBtn = $('settingsMenuBtn');
        const joyDec = $('joyDec'), joyInc = $('joyInc'), fireDec = $('fireDec'), fireInc = $('fireInc');
        const joySizeVal = $('joySizeVal'), fireSizeVal = $('fireSizeVal');
        const soundToggle = $('soundToggle');
        const hudWeapon = $('hudWeapon'), weaponBar = $('weaponBar');

        // ---------- Weapons (icons are the images — no external assets needed) ----------
        const WEAPONS = {
            rifle: { name: 'Scout', icon: '🔫', dmg: 35, cooldown: 400, speed: 32, life: 2.0, color: 0xffaa00, barrelLen: 1.1 },
            smg: { name: 'SMG', icon: '🔥', dmg: 14, cooldown: 130, speed: 28, life: 1.4, color: 0x33ffcc, barrelLen: 0.7 },
            sniper: { name: 'Rail', icon: '🎯', dmg: 70, cooldown: 950, speed: 55, life: 2.5, color: 0xff44ff, barrelLen: 1.7 },
        };
        let currentWeapon = localStorage.getItem('sniperMechaWeapon') || 'rifle';
        if (!WEAPONS[currentWeapon]) currentWeapon = 'rifle';
        function setWeapon(id) {
            if (!WEAPONS[id]) return;
            currentWeapon = id;
            localStorage.setItem('sniperMechaWeapon', id);
            document.querySelectorAll('.weapon-btn').forEach(b => b.classList.toggle('active', b.dataset.w === id));
            hudWeapon.textContent = `${WEAPONS[id].icon} ${WEAPONS[id].name}`;
            rebuildPlayerGun();
        }

        // ---------- Premium pilot skins (BGMI-style outfits, full tactical armor) ----------
        const SKINS = {
            commando: { name: 'Commando', icon: '🪖', color: 0x2299ff, trim: 0xffffff, hair: 'helmet', hairColor: 0x1a1a1a },
            glacier: { name: 'Glacier', icon: '❄️', color: 0x9be8ff, trim: 0xffd700, hair: 'helmet', hairColor: 0x223344 },
            inferno: { name: 'Valkyrie', icon: '🎀', color: 0xff5a3c, trim: 0xffd700, hair: 'ponytail', hairColor: 0x4a2a1a },
            viper: { name: 'Nova', icon: '🌙', color: 0x8a5cff, trim: 0x7fff9f, hair: 'bun', hairColor: 0x111111 },
        };
        let currentSkin = localStorage.getItem('sniperMechaSkin') || 'commando';
        if (!SKINS[currentSkin]) currentSkin = 'commando';
        function setSkin(id) {
            if (!SKINS[id]) return;
            currentSkin = id;
            localStorage.setItem('sniperMechaSkin', id);
            document.querySelectorAll('.skin-btn').forEach(b => b.classList.toggle('active', b.dataset.s === id));
            if (!player.mesh) return;
            const sk = SKINS[id];
            const px = player.mesh.position.x, pz = player.mesh.position.z, ry = player.mesh.rotation.y;
            scene.remove(player.mesh);
            player.mesh = createHumanoid(sk.color, currentWeapon, id);
            player.mesh.position.set(px, -0.5, pz);
            player.mesh.rotation.y = ry;
            scene.add(player.mesh);
            playerRing.material.color.set(sk.trim);
        }

        // ---------- Audio (no assets, WebAudio synth) ----------
        let audioCtx = null, soundOn = true;
        function ac() {
            if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;

                }
                for (const [id, info] of newRemote) {
                    if (!remotePlayers.has(id)) {
                        const sk = SKINS[info.skin] || SKINS.commando;
                        const mesh = createHumanoid(sk.color, 'rifle', info.skin || 'commando');
                        mesh.position.set(0, -0.5, 0);
                        scene.add(mesh);
                        remotePlayers.set(id, { mesh, ...info, skin: info.skin || 'commando', x: 0, z: 0, angle: 0, health: 100, alive: true });
                    }
                }
            });
            socket.on('world-update', (data) => {
                for (const p of data.players) {
                    if (p.id === socket.id) continue;
                    const remote = remotePlayers.get(p.id);
                    if (remote) {
                        if (p.skin && p.skin !== remote.skin && SKINS[p.skin]) {
                            scene.remove(remote.mesh);
                            const sk = SKINS[p.skin];
                            const mesh = createHumanoid(sk.color, 'rifle', p.skin);
                            scene.add(mesh);
                            remote.mesh = mesh;
                            remote.skin = p.skin;
                        }
                        remote.x = p.x; remote.z = p.y; remote.angle = p.angle;
                        remote.mesh.position.set(p.x, -0.5, p.y);
                        remote.mesh.rotation.y = -p.angle + Math.PI/2;
                        remote.mesh.visible = remote.alive !== false;
                        animateHumanoid(remote.mesh, true, 0.05);
                    }
                }
                updateBulletVisuals(data.bullets || []);
                let enemyHP = 100;
                for (const hp of data.hp) {
                    if (hp.id === socket.id) {
                        const wasAlive = player.alive;
                        player.health = hp.hp; player.alive = hp.alive;
                        hudPlayerHP.textContent = Math.ceil(hp.hp);
                        hudPlayerHP.className = hp.hp <= 30 ? 'hp-low' : '';
                        respawnEl.classList.toggle('show', !hp.alive);
                        if (wasAlive && !hp.alive) sfx.hurt();
                    } else {
                        const remote = remotePlayers.get(hp.id);
                        if (remote) { remote.health = hp.hp; remote.alive = hp.alive; enemyHP = hp.hp; }
                    }
                }
                hudEnemyHP.textContent = Math.ceil(enemyHP);
                renderScores(data.scores || []);
            });
            socket.on('match-joined', (data) => {
                currentRoom = data.room;
                player.name = data.name;
                isHost = data.host === socket.id;
                roomState = data.gameState;
                if (data.obstacles) { OBSTACLES = data.obstacles; buildObstacles(OBSTACLES); }
                for (const w of data.world) {
                    if (!remotePlayers.has(w.id)) {
                        const sk = SKINS[w.skin] || SKINS.commando;
                        const mesh = createHumanoid(sk.color, 'rifle', w.skin || 'commando');
                        mesh.position.set(w.x, -0.5, w.y);
                        scene.add(mesh);
                        remotePlayers.set(w.id, { mesh, name: w.name, playerIndex: w.playerIndex, skin: w.skin || 'commando', x: w.x, z: w.y, angle: w.angle, health: 100, alive: true });
                    }
                }
                // Stay in lobby until the host starts (server only simulates a live match).
                // Hiding the lobby here stranded the host with no Start button, so matches
                // never went live and the server ignored every shot -> no bullets.
                const me = (data.hp || []).find(h => h.id === socket.id);
                menu.classList.add('hidden');
                if (data.gameState === 'playing') {
                    lobby.classList.add('hidden');
                    controlsOverlay.classList.add('active');
                    weaponBar.classList.remove('hidden');
                    startMatch(data.gameDuration);
                } else {
                    lobby.classList.remove('hidden');
                    controlsOverlay.classList.remove('active');
                    weaponBar.classList.add('hidden');
                    gameState = STATE.LOBBY;
                    lobbyStatus.textContent = isHost
                        ? `Room ${data.room} — you are host, press Start`
                        : `Joined ${data.room} — waiting for host to start...`;
                }
                startGameBtn.classList.toggle('hidden', !(isHost && (roomState === 'waiting' || roomState === 'ended')));
            });
            socket.on('countdown', (data) => {
                lobby.classList.add('hidden');
                controlsOverlay.classList.add('active');
                weaponBar.classList.remove('hidden');
                gameState = STATE.COUNTDOWN;
                countdownEl.textContent = data.seconds;
                countdownEl.classList.add('show');
                sfx.count();
                if (data.seconds <= 0) countdownEl.classList.remove('show');
            });
            socket.on('game-start', (data) => {
                if (data.obstacles) { OBSTACLES = data.obstacles; buildObstacles(OBSTACLES); }
                lobby.classList.add('hidden');
                controlsOverlay.classList.add('active');
                weaponBar.classList.remove('hidden');
                countdownEl.textContent = 'GO!';
                sfx.go();
                setTimeout(() => countdownEl.classList.remove('show'), 600);
                startMatch(data.gameDuration);
            });
            socket.on('match-end', showGameOverMP);
            socket.on('player-left', (id) => {
                const r = remotePlayers.get(id);
                if (r) { scene.remove(r.mesh); remotePlayers.delete(id); }
            });
            socket.on('fx-shot', (d) => { sfx.shoot(); if (d) showMuzzle(d.x, d.y !== undefined ? d.y : d.z, d.weapon); });
            socket.on('fx-hit', () => { flashHitmarker(); sfx.hit(); });
            socket.on('kill-feed', (d) => {
                addKill(`${d.killer} ⚔ ${d.victim}`);
                if (d.killerId === socket.id) { flashHitmarker(); sfx.kill(); }
            });
        }

        function renderScores(scores) {
            if (!scores.length) { scoresEl.textContent = ''; return; }
            scoresEl.textContent = scores.map(s => `${s.name}: ${s.kills}`).join(' · ');
        }
        function addKill(text) {
            const div = document.createElement('div');
            div.className = 'kill-entry'; div.textContent = text;
            killfeedEl.appendChild(div);
            while (killfeedEl.children.length > 5) killfeedEl.firstChild.remove();
            setTimeout(() => div.remove(), 4000);
        }
        function flashHitmarker() {
            hitmarkerEl.style.opacity = '1';
            setTimeout(() => hitmarkerEl.style.opacity = '0', 150);
        }
        function flashVignette() {
            vignetteEl.classList.add('hit');
            setTimeout(() => vignetteEl.classList.remove('hit'), 250);
        }

        function renderRoomList(rooms) {
            roomList.innerHTML = '';
            if (!rooms.length) {
                const div = document.createElement('div');
                div.textContent = 'No rooms. Create one!';
                div.style.cssText = 'color:#8899bb;padding:12px';
                roomList.appendChild(div);
                return;
            }
            for (const r of rooms) {
                const div = document.createElement('div');
                div.className = 'room-item';
                div.innerHTML = `<span class="name">${r.name}</span><span class="players">${r.players}/6</span><span class="status">${r.gameState === 'playing' ? '🔴 Playing' : r.gameState === 'countdown' ? '⏳ Starting' : '🟢 Waiting'}</span>`;
                div.addEventListener('click', () => joinRoom(r.name));
                roomList.appendChild(div);
            }
        }

        function joinRoom(name) {
            if (!socket) return;
            const playerName = nameInput.value.trim() || 'Player';
            socket.emit('join-room', name, playerName, (res) => {
                lobbyStatus.textContent = res && res.ok ? `Joined: ${res.room}${isHost ? ' (host — press Start)' : ''}` : 'Failed: ' + ((res && res.error) || 'unknown');
            });
        }

        function fmtTime(s) {
            s = Math.max(0, Math.ceil(s));
            return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
        }
        function startMatch(duration) {
            matchTime = duration || 600;
            gameState = STATE.PLAYING;
            weaponBar.classList.remove('hidden');
            hudTimer.textContent = fmtTime(matchTime);
            if (matchTimerInterval) clearInterval(matchTimerInterval);
            matchTimerInterval = setInterval(() => {
                matchTime--;
                hudTimer.textContent = fmtTime(matchTime);
                if (matchTime <= 0) clearInterval(matchTimerInterval);
            }, 1000);
        }

        function showGameOverMP(data) {
            gameState = STATE.GAMEOVER;
            controlsOverlay.classList.remove('active');
            weaponBar.classList.add('hidden');
            countdownEl.classList.remove('show');
            respawnEl.classList.remove('show');
            const winner = data.rankings && data.rankings[0];
            const isWinner = winner && socket && winner.id === socket.id;
            gameOverTitle.textContent = isWinner ? '🏆 YOU WIN!' : '💀 YOU LOSE';
            gameOverTitle.style.color = isWinner ? '#44ff44' : '#ff4444';
            gameOverSub.textContent = (data.rankings || []).map(r => `#${r.rank} ${r.name} — ${r.kills} kills`).join('\n') || 'Match over';
            gameOverMenu.classList.remove('hidden');
            if (matchTimerInterval) clearInterval(matchTimerInterval);
        }

        // ---------- Bot mode ----------
        function startBotMatch() {
            botMode = true;
            menu.classList.add('hidden'); lobby.classList.add('hidden');
            gameOverMenu.classList.add('hidden');
            controlsOverlay.classList.add('active');
            weaponBar.classList.remove('hidden');
            // reset
            player.x = -6; player.z = 0; player.health = 100; player.alive = true; player.kills = 0;
            player.mesh.position.set(player.x, -0.5, player.z);
            bot.x = 6; bot.z = 0; bot.health = 100; bot.alive = true; bot.kills = 0;
            botSkin = ['glacier', 'inferno', 'viper'][Math.floor(Math.random() * 3)];
            ensureBotMesh();
            updateBulletVisuals([]);
            killfeedEl.innerHTML = '';
            hudPlayerHP.textContent = '100'; hudEnemyHP.textContent = '100';
            scoresEl.textContent = 'You: 0 · Bot: 0';
            // countdown 3-2-1
            gameState = STATE.COUNTDOWN;
            let n = 3;
            countdownEl.textContent = n; countdownEl.classList.add('show'); sfx.count();
            const iv = setInterval(() => {
                n--;
                if (n <= 0) {
                    clearInterval(iv);
                    countdownEl.textContent = 'GO!'; sfx.go();
                    setTimeout(() => countdownEl.classList.remove('show'), 500);
                    startMatch(300);
                } else { countdownEl.textContent = n; sfx.count(); }
            }, 800);
        }
        function botTakeDamage(dmg) {
            if (!bot.alive || gameState !== STATE.PLAYING) return;
            bot.health -= dmg;
            flashHitmarker(); sfx.hit();
            if (bot.health <= 0) {
                bot.health = 0; bot.alive = false;
                bot.mesh.visible = false;
                bot.respawnAt = performance.now() + 2000;
                player.kills++;
                addKill(`You ⚔ Bot (${player.kills}-${bot.kills})`); sfx.kill();
                scoresEl.textContent = `You: ${player.kills} · Bot: ${bot.kills}`;
                hudEnemyHP.textContent = '0';
                if (player.kills >= 5) endBotMatch(true);
            } else hudEnemyHP.textContent = Math.ceil(bot.health);
        }
        function playerTakeDamage(dmg) {
            if (!player.alive || gameState !== STATE.PLAYING) return;
            player.health -= dmg;
            flashVignette(); sfx.hurt();
            hudPlayerHP.textContent = Math.ceil(Math.max(0, player.health));
            if (player.health <= 0) {
                player.health = 0; player.alive = false;
                bot.kills++;
                addKill(`Bot ⚔ You (${player.kills}-${bot.kills})`);
                scoresEl.textContent = `You: ${player.kills} · Bot: ${bot.kills}`;
                respawnEl.classList.add('show');
                setTimeout(() => {
                    player.health = 100; player.alive = true;
                    player.x = -12; player.z = (Math.random()-0.5)*10;
                    hudPlayerHP.textContent = '100';
                    respawnEl.classList.remove('show');
                }, 2000);
                if (bot.kills >= 5) endBotMatch(false);
            }
        }
        function endBotMatch(won) {
            gameState = STATE.GAMEOVER;
            controlsOverlay.classList.remove('active');
            weaponBar.classList.add('hidden');
            if (matchTimerInterval) clearInterval(matchTimerInterval);
            gameOverTitle.textContent = won ? '🏆 YOU WIN!' : '💀 BOT WINS';
            gameOverTitle.style.color = won ? '#44ff44' : '#ff4444';
            gameOverSub.textContent = `You ${player.kills} — ${bot.kills} Bot`;
            gameOverMenu.classList.remove('hidden');
        }
        function updateBot(dt, now) {
            if (!botMode || gameState !== STATE.PLAYING) return;
            if (!bot.alive) {
                if (now >= bot.respawnAt && bot.kills < 5 && player.kills < 5) {
                    bot.alive = true; bot.health = 100;
                    bot.x = 12; bot.z = (Math.random()-0.5)*12;
                    bot.mesh.visible = true;
                    hudEnemyHP.textContent = '100';
                }
                return;
            }
            const dx = player.x - bot.x, dz = player.z - bot.z;
            const dist = Math.hypot(dx, dz) || 1;
            bot.angle = Math.atan2(dz, dx);
            bot.mesh.rotation.y = -bot.angle + Math.PI/2;
            bot.mesh.position.set(bot.x, -0.5, bot.z);
            animateHumanoid(bot.mesh, true, dt);
            // movement: chase / retreat / strafe
            let mx = 0, mz = 0;
            bot.strafeT += dt;
            if (bot.strafeT > 2) { bot.strafeT = 0; bot.strafeDir *= -1; }
            if (dist > 11) { mx = dx/dist; mz = dz/dist; }
            else if (dist < 5) { mx = -dx/dist; mz = -dz/dist; }
            else { mx = -dz/dist * bot.strafeDir; mz = dx/dist * bot.strafeDir; }
            const sp = 3.6 * dt;
            const nx = Math.max(-BOUNDS, Math.min(BOUNDS, bot.x + mx * sp));
            const nz = Math.max(-BOUNDS, Math.min(BOUNDS, bot.z + mz * sp));
            if (!pointBlocked(nx, nz)) { bot.x = nx; bot.z = nz; }
            // shoot with LOS + inaccuracy
            if (now - bot.lastShot > bot.shootCooldown && player.alive && dist < 22 && !lineBlocked(bot.x, bot.z, player.x, player.z)) {
                bot.lastShot = now;
                sfx.shoot();
                // muzzle flash
                if (Math.random() < 0.75) playerTakeDamage(12 + Math.random()*10);
            }
        }

        // ---------- Combat (bot mode shooting, manual aim only) ----------
        const botBullets = []; // {x,z,vx,vy,life,weapon}
        function weaponCooldown() { return WEAPONS[currentWeapon].cooldown; }
        function tryFireManual() {
            const now = performance.now();
            const w = WEAPONS[currentWeapon];
            if (now - player.lastShot < w.cooldown || !player.alive || gameState !== STATE.PLAYING) return false;
            player.lastShot = now;
            // per-weapon sound
            if (currentWeapon === 'smg') beep(300, 0.06, 'square', 0.06);
            else if (currentWeapon === 'sniper') { beep(120, 0.18, 'sawtooth', 0.1); beep(60, 0.2, 'square', 0.08, 0.02); }
            else sfx.shoot();
            const ang = player.angle;
            const sx = player.x + Math.cos(ang)*1.5, sz = player.z + Math.sin(ang)*1.5;
            if (botMode) {
                botBullets.push({ x: sx, z: sz, vx: Math.cos(ang)*w.speed, vy: Math.sin(ang)*w.speed, life: w.life, weapon: currentWeapon, dmg: w.dmg });
            } else if (socket) {
                socket.emit('player-fire', { x: player.x, y: player.z, angle: player.angle, weapon: currentWeapon });
            }
            showMuzzle(sx, sz, currentWeapon);
            return true;
        }
        function updateBotBullets(dt) {
            for (let i = botBullets.length - 1; i >= 0; i--) {
                const b = botBullets[i];
                b.x += b.vx * dt; b.z += b.vy * dt; b.life -= dt;
                let dead = b.life <= 0 || Math.abs(b.x) > BOUNDS+2 || Math.abs(b.z) > BOUNDS+2;
                if (!dead) {
                    for (const o of OBSTACLES) {
                        if (Math.abs(b.x-o.x) < o.w/2 && Math.abs(b.z-o.z) < o.h/2) { dead = true; break; }
                    }
                }
                if (!dead && bot.alive) {
                    if (Math.hypot(b.x - bot.x, b.z - bot.z) < 1.6) { botTakeDamage(b.dmg || 35); dead = true; }
                }
                if (dead) botBullets.splice(i, 1);
            }
            updateBulletVisuals(botBullets);
        }

        // ---------- Per-frame update ----------
        const clock = new THREE.Clock();
        function faceAngle(angle) { return -angle + Math.PI/2; }
        function movePlayer(dt) {
            let dx = 0, dz = 0;
            if (keys.w) dz -= 1;
            if (keys.s) dz += 1;
            if (keys.a) dx -= 1;
            if (keys.d) dx += 1;
            if (joystickActive) { dx += joystickDX; dz += joystickDY; }
            const len = Math.hypot(dx, dz);
            playerMoving = len > 0.15;
            if (len > 0.1 && player.alive) {
                dx = dx/len * Math.min(len,1) * player.speed * dt;
                dz = dz/len * Math.min(len,1) * player.speed * dt;
                const nx = Math.max(-BOUNDS, Math.min(BOUNDS, player.x + dx));
                const nz = Math.max(-BOUNDS, Math.min(BOUNDS, player.z + dz));
                if (!pointBlocked(nx, player.z)) player.x = nx;
                if (!pointBlocked(player.x, nz)) player.z = nz;
                player.mesh.position.set(player.x, -0.5, player.z);
            }
        }
        function aimPlayerMouse() {
            if (aimActive) return; // touch aim joystick overrides mouse
            const rect = renderer.domElement.getBoundingClientRect();
            const ndcX = ((mouseX - rect.left) / rect.width) * 2 - 1;
            const ndcY = -((mouseY - rect.top) / rect.height) * 2 + 1;
            const vector = new THREE.Vector3(ndcX, ndcY, 0.5);
            vector.unproject(camera);
            const dir = vector.sub(camera.position).normalize();
            if (Math.abs(dir.y) < 1e-4) return;
            const distance = -camera.position.y / dir.y;
            if (distance < 0) return;
            const pos = camera.position.clone().add(dir.multiplyScalar(distance));
            player.angle = Math.atan2(pos.z - player.z, pos.x - player.x);
            player.mesh.rotation.y = faceAngle(player.angle);
        }

        function update(dt, now) {
            if (gameState !== STATE.PLAYING) return;
            movePlayer(dt);
            aimPlayerMouse();
            animateHumanoid(player.mesh, playerMoving, dt);
            // aim guide
            aimLine.position.set(player.x, 0.3, player.z);
            aimLine.rotation.y = faceAngle(player.angle);
            aimLine.visible = player.alive;
            updateBot(dt, now);

            if (aimActive && player.alive) {
                tryFireManual();
            }
            if (botMode) updateBotBullets(dt);

            if (socket && !botMode && player.alive) {
                socket.emit('player-state', { x: player.x, y: player.z, angle: player.angle, facingRight: true, skin: currentSkin });
            }
            if (botMode) hudPlayerHP.textContent = Math.ceil(Math.max(0, player.health));
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            update(dt, performance.now());
            if (gameState === STATE.PLAYING || gameState === STATE.COUNTDOWN) {
                camera.position.x += (player.x - camera.position.x) * 0.12;
                camera.position.z += ((player.z + 20) - camera.position.z) * 0.12;
                camera.position.y += (15 - camera.position.y) * 0.12;
                camera.lookAt(player.x, 0, player.z);
                playerRing.position.set(player.x, -0.36, player.z);
                playerRing.visible = gameState === STATE.PLAYING;
                if (botMode && bot.mesh) botRing.position.set(bot.x, -0.36, bot.z);
            } else {
                camera.position.set(0, 25, 25);
                camera.lookAt(0, 0, 0);
                // idle spin for menu backdrop
                player.mesh.rotation.y += dt * 0.6;
            }
            renderer.render(scene, camera);
        }
        animate();

        // ---------- Events ----------
        document.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k in keys) { keys[k] = true; e.preventDefault(); }
            if (k === '1') setWeapon('rifle');
            if (k === '2') setWeapon('smg');
            if (k === '3') setWeapon('sniper');
        });
        document.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k in keys) { keys[k] = false; e.preventDefault(); }
        });

        renderer.domElement.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
        renderer.domElement.addEventListener('mousedown', (e) => {
            if (e.button !== 0 || gameState !== STATE.PLAYING || !player.alive) return;
            ac();
            const rect = renderer.domElement.getBoundingClientRect();
            const ndcX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            const ndcY = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            const vector = new THREE.Vector3(ndcX, ndcY, 0.5);
            vector.unproject(camera);
            const dir = vector.sub(camera.position).normalize();
            const distance = -camera.position.y / dir.y;
            const pos = camera.position.clone().add(dir.multiplyScalar(distance));
            player.angle = Math.atan2(pos.z - player.z, pos.x - player.x);
            player.mesh.rotation.y = -player.angle + Math.PI/2;
            tryFireManual();
        });
        renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

        // Touch detection: reveal mobile controls
        window.addEventListener('touchstart', function once() {
            controlsOverlay.classList.add('touch');
        }, { once: true, passive: true });

        function joystickSet(e) {
            const touch = e.touches[0];
            if (!touch) return;
            const rect = moveJoystickBase.getBoundingClientRect();
            const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
            let dx = touch.clientX - cx, dy = touch.clientY - cy;
            const maxR = rect.width/2;
            const mag = Math.hypot(dx, dy) || 1;
            const cl = Math.min(mag, maxR);
            const ang = Math.atan2(dy, dx);
            const tx = Math.cos(ang)*cl, ty = Math.sin(ang)*cl;
            const half = moveJoystickThumb.clientWidth/2;
            moveJoystickThumb.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px))`;
            void half;
            joystickActive = true;
            joystickDX = Math.max(-1, Math.min(1, dx / maxR));
            joystickDY = Math.max(-1, Math.min(1, dy / maxR));
        }
        function joystickEnd(e) {
            if (e) e.preventDefault();
            moveJoystickThumb.style.transform = 'translate(-50%, -50%)';
            joystickActive = false; joystickDX = 0; joystickDY = 0;
        }
        moveJoystickArea.addEventListener('touchstart', (e) => { e.preventDefault(); joystickSet(e); }, { passive: false });
        moveJoystickArea.addEventListener('touchmove', (e) => { e.preventDefault(); joystickSet(e); }, { passive: false });
        moveJoystickArea.addEventListener('touchend', joystickEnd);
        moveJoystickArea.addEventListener('touchcancel', joystickEnd);

        // Right side: drag 🔥 like a joystick to aim manually + hold to fire. No auto-aim.
        function aimSet(e) {
            const t = [...e.touches].find(t => t.identifier === aimTouchId) || e.touches[0];
            if (!t) return;
            let dx = t.clientX - aimCenterX, dy = t.clientY - aimCenterY;
            const maxR = 60;
            const mag = Math.hypot(dx, dy);
            if (mag > 8) {
                player.angle = Math.atan2(dy, dx);
                player.mesh.rotation.y = -player.angle + Math.PI/2;
                aimDX = dx / mag; aimDY = dy / mag;
            }
            const cl = Math.min(mag, maxR);
            const ang = Math.atan2(dy, dx);
            fireThumb.style.transform = `translate(calc(-50% + ${Math.cos(ang)*cl}px), calc(-50% + ${Math.sin(ang)*cl}px))`;
            aimActive = true;
        }
        function aimEnd(e) {
            if (e && aimTouchId !== null && e.touches && [...e.touches].some(t => t.identifier === aimTouchId)) return;
            aimTouchId = null; aimActive = false;
            fireThumb.style.transform = 'translate(-50%,-50%)';
            if (e) e.preventDefault();
        }
        fireBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); ac();
            const t = e.changedTouches[0];
            aimTouchId = t.identifier;
            const r = fireBtn.getBoundingClientRect();
            aimCenterX = r.left + r.width/2; aimCenterY = r.top + r.height/2;
            aimSet(e);
        }, { passive: false });
        fireBtn.addEventListener('touchmove', (e) => { e.preventDefault(); aimSet(e); }, { passive: false });
        fireBtn.addEventListener('touchend', aimEnd);
        fireBtn.addEventListener('touchcancel', aimEnd);

        // Settings
        settingsBtn.addEventListener('click', () => { settingsPanel.classList.toggle('show'); ac(); });
        settingsCloseBtn.addEventListener('click', () => settingsPanel.classList.remove('show'));
        function returnToMenu() {
            settingsPanel.classList.remove('show');
            gameOverMenu.classList.add('hidden');
            lobby.classList.add('hidden');
            menu.classList.remove('hidden');
            gameState = STATE.MENU;
            botMode = false; hideBot();
            aimActive = false;
            if (socket) { try { socket.emit('leave-room'); } catch(e) {} socket.disconnect(); socket = null; }
            for (const [, r] of remotePlayers) scene.remove(r.mesh);
            remotePlayers.clear();
            updateBulletVisuals([]);
            botBullets.length = 0;
            controlsOverlay.classList.remove('active');
            weaponBar.classList.add('hidden');
            if (matchTimerInterval) clearInterval(matchTimerInterval);
            player.health = 100; player.alive = true; player.x = -6; player.z = 0;
            player.mesh.position.set(player.x, -0.5, player.z);
            hudPlayerHP.textContent = '100'; hudEnemyHP.textContent = '100';
            scoresEl.textContent = ''; killfeedEl.innerHTML = '';
            respawnEl.classList.remove('show');
        }
        settingsMenuBtn.addEventListener('click', returnToMenu);
        function bumpSetting(key, delta, el) {
            settings[key] = Math.max(10, Math.min(50, settings[key] + delta));
            el.textContent = settings[key] + '%';
            saveSettings();
            moveJoystickArea.style.width = settings.joySize + '%';
            fireBtn.style.width = settings.fireSize + '%';
        }
        joyDec.addEventListener('click', () => bumpSetting('joySize', -2, joySizeVal));
        joyInc.addEventListener('click', () => bumpSetting('joySize', 2, joySizeVal));
        fireDec.addEventListener('click', () => bumpSetting('fireSize', -2, fireSizeVal));
        fireInc.addEventListener('click', () => bumpSetting('fireSize', 2, fireSizeVal));
        soundToggle.addEventListener('click', () => {
            soundOn = !soundOn;
            soundToggle.textContent = soundOn ? '🔊' : '🔇';
        });
        document.querySelectorAll('.weapon-btn').forEach(b => b.addEventListener('click', () => { ac(); setWeapon(b.dataset.w); }));
        document.querySelectorAll('.skin-btn').forEach(b => b.addEventListener('click', () => { ac(); setSkin(b.dataset.s); }));

        // Menu
        playBtn.addEventListener('click', () => { ac(); hideBot(); startBotMatch(); });
        multiBtn.addEventListener('click', () => {
            ac();
            botMode = false; hideBot();
            menu.classList.add('hidden');
            lobby.classList.remove('hidden');
            gameState = STATE.LOBBY;
            connectSocket();
            socket.emit('list-rooms', renderRoomList);
        });
        backToMenuBtn.addEventListener('click', returnToMenu);
        createRoomBtn.addEventListener('click', () => {
            const name = nameInput.value.trim() || 'Player';
            socket.emit('set-name', name);
            const roomName = 'room_' + Math.random().toString(36).slice(2, 8);
            socket.emit('join-room', roomName, name, (res) => {
                lobbyStatus.textContent = res && res.ok ? `Created: ${roomName} (you are host — press Start)` : 'Failed to create.';
            });
        });
        refreshRoomsBtn.addEventListener('click', () => socket.emit('list-rooms', renderRoomList));
        startGameBtn.addEventListener('click', () => {
            if (socket && isHost) { socket.emit('start-game'); lobbyStatus.textContent = 'Starting...'; }
        });
        nameInput.addEventListener('change', () => {
            if (socket) socket.emit('set-name', nameInput.value.trim() || 'Player');
        });

        gameOverReturnBtn.addEventListener('click', returnToMenu);

        window.addEventListener('resize', () => {
            renderer.setSize(container.clientWidth, container.clientHeight);
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
        });

        // Init
        loadSettings();
        setWeapon(currentWeapon);
        setSkin(currentSkin);
        hudTimer.textContent = fmtTime(600);
        menu.classList.remove('hidden');
        lobby.classList.add('hidden');
        gameOverMenu.classList.add('hidden');
        gameState = STATE.MENU;
        console.log('Sniper Mecha upgraded loaded');
    </script>
</body>
</html>
