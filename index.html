<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sniper Mecha 1v1 - Multiplayer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-touch-callout: none; touch-action: none; }
        body {
            background: #0a0a1a;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #gameWrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0a1a;
        }
        #three-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Overlays */
        #menu, #lobby, #gameOverMenu {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 30, 0.85);
            backdrop-filter: blur(6px);
            z-index: 20;
            pointer-events: auto;
            transition: opacity 0.3s;
        }
        #menu.hidden, #lobby.hidden, #gameOverMenu.hidden { opacity: 0; pointer-events: none; display: none; }
        #menu h1, #lobby h1, #gameOverMenu h1 {
            font-size: clamp(2rem, 8vw, 4rem);
            color: #88ccff;
            text-shadow: 0 0 20px #44aaff;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        #menu p, #lobby p, #gameOverMenu p {
            color: #8899bb;
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            margin-bottom: 30px;
        }
        .menu-btn {
            background: #1a2a4a;
            border: 2px solid #3a6a9a;
            color: #ccddff;
            font-size: clamp(1rem, 3vw, 1.6rem);
            padding: 12px 28px;
            margin: 10px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            min-width: 160px;
            text-align: center;
            font-weight: 600;
            letter-spacing: 1px;
            touch-action: manipulation;
        }
        .menu-btn:hover { background: #2a4a7a; border-color: #6a9aff; transform: scale(1.03); }
        .menu-btn:active { transform: scale(0.97); }
        .menu-btn.disabled { opacity: 0.4; cursor: not-allowed; border-color: #3a3a4a; }

        #lobby .room-list {
            width: min(90%, 500px);
            max-height: 40vh;
            overflow-y: auto;
            background: rgba(20,20,40,0.6);
            border-radius: 12px;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #2a2a5a;
        }
        .room-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid #1a1a3a;
            color: #aac;
            cursor: pointer;
            transition: 0.1s;
        }
        .room-item:hover { background: #2a2a5a; }
        .room-item .name { font-weight: bold; color: #88ccff; }
        .room-item .players { color: #8899bb; }
        .room-item .status { font-size: 0.8em; color: #ffcc44; }

        .input-field {
            background: #1a1a2a;
            border: 1px solid #3a5a7a;
            color: #ccddff;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 1rem;
            margin: 5px;
            width: 80%;
            max-width: 300px;
            outline: none;
        }
        .input-field:focus { border-color: #6a9aff; }

        .lobby-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .lobby-actions .menu-btn { min-width: 120px; font-size: 1rem; padding: 10px 20px; }

        /* HUD */
        #hud {
            position: absolute;
            top: 10px; left: 10px;
            color: #aac;
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            font-family: monospace;
            z-index: 15;
            pointer-events: none;
            text-shadow: 0 0 10px #000;
            line-height: 1.6;
        }
        #hud .timer { font-size: clamp(1rem, 3vw, 1.6rem); color: #ffcc44; }

        #settingsBtn {
            position: absolute;
            top: 12px; right: 12px;
            z-index: 16;
            background: rgba(0,0,0,0.5);
            border: 1px solid #3a5a7a;
            color: #ccddff;
            border-radius: 50%;
            width: clamp(28px, 4vw, 36px);
            height: clamp(28px, 4vw, 36px);
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            touch-action: manipulation;
            transition: 0.2s;
        }
        #settingsBtn:hover { background: rgba(30,60,100,0.7); }
        #settingsBtn:active { transform: scale(0.9); }

        #settingsPanel {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: min(90%, 350px);
            background: rgba(10,10,30,0.95);
            border: 2px solid #3a5a8a;
            border-radius: 20px;
            padding: 24px 20px;
            z-index: 30;
            display: none;
            flex-direction: column;
            gap: 16px;
            backdrop-filter: blur(8px);
            pointer-events: auto;
        }
        #settingsPanel.show { display: flex; }
        #settingsPanel h2 { color: #88ccff; font-size: 1.4rem; text-align: center; }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #aac;
            font-size: 0.95rem;
        }
        .setting-row button {
            background: #2a3a5a;
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            touch-action: manipulation;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .setting-row button:active { transform: scale(0.9); }
        .setting-row span { min-width: 40px; text-align: center; color: #88ccff; }
        .settings-close-btn {
            background: #2a3a5a;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 6px;
            touch-action: manipulation;
        }
        .settings-reset-btn {
            background: #3a2a2a;
            border: none;
            color: #ff8866;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            touch-action: manipulation;
        }

        /* Touch controls */
        #controlsOverlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            touch-action: none;
        }
        #controlsOverlay.active { pointer-events: auto; }
        .joystick-area {
            position: absolute;
            width: 30%;
            aspect-ratio: 1/1;
            bottom: 8%; left: 5%;
            pointer-events: auto;
            touch-action: none;
            transition: all 0.1s;
        }
        .joystick-base {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.15);
            position: relative;
            touch-action: none;
        }
        .joystick-thumb {
            width: 45%; height: 45%;
            border-radius: 50%;
            background: rgba(100,180,255,0.5);
            border: 2px solid rgba(100,180,255,0.8);
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            touch-action: none;
            transition: none;
        }
        .fire-btn {
            position: absolute;
            width: 18%;
            aspect-ratio: 1/1;
            bottom: 10%; right: 8%;
            border-radius: 50%;
            background: radial-gradient(circle, #ff6644, #cc2200);
            border: 3px solid #ffaa44;
            color: white;
            font-size: clamp(1.2rem, 4vw, 2.2rem);
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: manipulation;
            box-shadow: 0 0 30px rgba(255,50,0,0.5);
            cursor: pointer;
            text-shadow: 0 0 10px rgba(255,255,200,0.8);
            user-select: none;
            transition: all 0.1s;
        }
        .fire-btn:active { transform: scale(0.92); box-shadow: 0 0 50px rgba(255,50,0,0.8); }
    </style>
</head>
<body>
    <div id="gameWrapper">
        <div id="three-canvas"></div>

        <!-- Menu -->
        <div id="menu">
            <h1>🔫 SNIPER MECHA</h1>
            <p>Multiplayer 1v1 · BGMI WOW Style</p>
            <button class="menu-btn" id="playBtn">▶ Play vs Bot</button>
            <button class="menu-btn" id="multiBtn">🌐 Online Multiplayer</button>
        </div>

        <!-- Lobby -->
        <div id="lobby" class="hidden">
            <h1>🌐 Lobby</h1>
            <input class="input-field" id="nameInput" placeholder="Your name" value="Player" />
            <div class="room-list" id="roomList"></div>
            <div class="lobby-actions">
                <button class="menu-btn" id="createRoomBtn">➕ Create Room</button>
                <button class="menu-btn" id="refreshRoomsBtn">🔄 Refresh</button>
                <button class="menu-btn" id="backToMenuBtn">↩ Back</button>
            </div>
            <div style="margin-top:10px;color:#8899bb;font-size:0.9rem;">
                <span id="lobbyStatus">Select or create a room</span>
            </div>
        </div>

        <!-- Game Over -->
        <div id="gameOverMenu" class="hidden">
            <h1 id="gameOverTitle">🏆 YOU WIN!</h1>
            <div class="sub" id="gameOverSub">Match over</div>
            <button class="menu-btn" id="gameOverReturnBtn">↩ Return to Menu</button>
        </div>

        <!-- HUD -->
        <div id="hud">
            <div>HP: <span id="hudPlayerHP">100</span></div>
            <div>Enemy: <span id="hudEnemyHP">100</span></div>
            <div class="timer">⏱ <span id="hudTimer">60</span>s</div>
        </div>

        <div id="settingsBtn">⚙</div>
        <div id="settingsPanel">
            <h2>⚙ Controls</h2>
            <div class="setting-row">
                <label>Joystick size</label>
                <button id="joyDec">−</button>
                <span id="joySizeVal">30%</span>
                <button id="joyInc">+</button>
            </div>
            <div class="setting-row">
                <label>Fire button size</label>
                <button id="fireDec">−</button>
                <span id="fireSizeVal">18%</span>
                <button id="fireInc">+</button>
            </div>
            <button class="settings-reset-btn" id="resetSettingsBtn">↺ Reset to default</button>
            <button class="settings-close-btn" id="settingsCloseBtn">Close</button>
        </div>

        <!-- Touch Controls -->
        <div id="controlsOverlay">
            <div class="joystick-area" id="moveJoystickArea">
                <div class="joystick-base" id="moveJoystickBase">
                    <div class="joystick-thumb" id="moveJoystickThumb"></div>
                </div>
            </div>
            <div class="fire-btn" id="fireBtn">🔥</div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "socket.io-client": "https://cdn.socket.io/4.7.5/socket.io.esm.min.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import io from 'socket.io-client';

        // DOM refs
        const container = document.getElementById('three-canvas');
        const menu = document.getElementById('menu');
        const lobby = document.getElementById('lobby');
        const playBtn = document.getElementById('playBtn');
        const multiBtn = document.getElementById('multiBtn');
        const backToMenuBtn = document.getElementById('backToMenuBtn');
        const createRoomBtn = document.getElementById('createRoomBtn');
        const refreshRoomsBtn = document.getElementById('refreshRoomsBtn');
        const roomList = document.getElementById('roomList');
        const nameInput = document.getElementById('nameInput');
        const lobbyStatus = document.getElementById('lobbyStatus');
        const gameOverMenu = document.getElementById('gameOverMenu');
        const gameOverTitle = document.getElementById('gameOverTitle');
        const gameOverSub = document.getElementById('gameOverSub');
        const gameOverReturnBtn = document.getElementById('gameOverReturnBtn');
        const hudPlayerHP = document.getElementById('hudPlayerHP');
        const hudEnemyHP = document.getElementById('hudEnemyHP');
        const hudTimer = document.getElementById('hudTimer');
        const controlsOverlay = document.getElementById('controlsOverlay');
        const moveJoystickArea = document.getElementById('moveJoystickArea');
        const moveJoystickBase = document.getElementById('moveJoystickBase');
        const moveJoystickThumb = document.getElementById('moveJoystickThumb');
        const fireBtn = document.getElementById('fireBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const settingsCloseBtn = document.getElementById('settingsCloseBtn');
        const resetSettingsBtn = document.getElementById('resetSettingsBtn');
        const joyDec = document.getElementById('joyDec');
        const joyInc = document.getElementById('joyInc');
        const fireDec = document.getElementById('fireDec');
        const fireInc = document.getElementById('fireInc');
        const joySizeVal = document.getElementById('joySizeVal');
        const fireSizeVal = document.getElementById('fireSizeVal');

        // ===== Three.js setup =====
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 25, 25);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);
        const fillLight = new THREE.DirectionalLight(0x4488ff, 0.3);
        fillLight.position.set(-10, 5, -10);
        scene.add(fillLight);

        // Ground
        const groundGeo = new THREE.PlaneGeometry(40, 40);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x141428, roughness: 0.7, metalness: 0.1 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.5;
        ground.receiveShadow = true;
        scene.add(ground);
        const gridHelper = new THREE.GridHelper(40, 20, 0x2a2a5a, 0x1a1a3a);
        gridHelper.position.y = -0.4;
        scene.add(gridHelper);

        // ===== Game state =====
        const STATE = { MENU: 0, LOBBY: 1, COUNTDOWN: 2, PLAYING: 3, GAMEOVER: 4 };
        let gameState = STATE.MENU;
        let countdown = 3;
        let matchTime = 60;
        let matchTimerInterval = null;
        let gameOverWinner = null;
        const BOUNDS = 18;

        // ===== Players (local) =====
        const player = {
            x: -6, z: 0,
            radius: 1.2,
            speed: 0.07,
            health: 100,
            maxHealth: 100,
            angle: 0,
            cooldown: 0,
            shootCooldown: 400, // ms
            alive: true,
            mesh: null,
            socketId: null,
            playerIndex: 0,
            name: 'Player'
        };
        // Remote players: map socketId -> { mesh, x, z, angle, health, alive, name, playerIndex }
        const remotePlayers = new Map();

        // ===== Bullets (visual only) =====
        const bulletMeshes = [];

        // ===== Humanoid creation =====
        function createHumanoid(color, isLocal = false) {
            const group = new THREE.Group();
            // Body
            const bodyGeo = new THREE.CylinderGeometry(0.7, 0.7, 1.4, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.7;
            body.castShadow = true;
            group.add(body);
            // Head
            const headGeo = new THREE.SphereGeometry(0.5, 8, 8);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc99, roughness: 0.6 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.6;
            head.castShadow = true;
            group.add(head);
            // Arms
            const armMat = new THREE.MeshStandardMaterial({ color, roughness: 0.5 });
            const armGeo = new THREE.BoxGeometry(0.2, 1.0, 0.2);
            const armL = new THREE.Mesh(armGeo, armMat);
            armL.position.set(-0.8, 0.9, 0);
            armL.castShadow = true;
            group.add(armL);
            const armR = new THREE.Mesh(armGeo, armMat);
            armR.position.set(0.8, 0.9, 0);
            armR.castShadow = true;
            group.add(armR);
            // Legs
            const legMat = new THREE.MeshStandardMaterial({ color: 0x333366, roughness: 0.6 });
            const legGeo = new THREE.BoxGeometry(0.3, 0.8, 0.3);
            const legL = new THREE.Mesh(legGeo, legMat);
            legL.position.set(-0.3, 0.1, 0);
            legL.castShadow = true;
            group.add(legL);
            const legR = new THREE.Mesh(legGeo, legMat);
            legR.position.set(0.3, 0.1, 0);
            legR.castShadow = true;
            group.add(legR);
            // Sniper rifle
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.3, metalness: 0.7 });
            const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.15, 0.15), gunMat);
            gunBody.position.set(0.7, 0.2, 0.6);
            group.add(gunBody);
            const gunBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.6), gunMat);
            gunBarrel.rotation.x = Math.PI/2;
            gunBarrel.position.set(0.7, 0.2, 1.0);
            group.add(gunBarrel);
            const scopeMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0xffaa00, emissiveIntensity: 0.3 });
            const scope = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), scopeMat);
            scope.position.set(0.7, 0.35, 0.8);
            group.add(scope);
            group.scale.set(0.6, 0.6, 0.6);
            return group;
        }

        // Create local player mesh
        const playerGroup = createHumanoid(0x44aaff, true);
        playerGroup.position.set(player.x, -0.5, player.z);
        scene.add(playerGroup);
        player.mesh = playerGroup;

        // ===== Input =====
        const keys = { w: false, a: false, s: false, d: false };
        let mouseX = 0, mouseY = 0;
        let mouseDown = false;
        let joystickActive = false;
        let joystickDX = 0, joystickDY = 0;
        let touchFire = false;

        // ===== Settings =====
        const defaultSettings = { joySize: 30, fireSize: 18 };
        let settings = { ...defaultSettings };

        function loadSettings() {
            try {
                const stored = JSON.parse(localStorage.getItem('sniperMechaSettings'));
                if (stored) {
                    for (let key in defaultSettings) {
                        if (stored[key] !== undefined) settings[key] = stored[key];
                    }
                }
            } catch(e) {}
            applySettingsUI();
            applySettingsToControls();
        }
        function saveSettings() {
            localStorage.setItem('sniperMechaSettings', JSON.stringify(settings));
        }
        function applySettingsUI() {
            joySizeVal.textContent = settings.joySize + '%';
            fireSizeVal.textContent = settings.fireSize + '%';
        }
        function applySettingsToControls() {
            moveJoystickArea.style.width = settings.joySize + '%';
            moveJoystickArea.style.aspectRatio = '1/1';
            fireBtn.style.width = settings.fireSize + '%';
            fireBtn.style.aspectRatio = '1/1';
        }
        function resetSettingsToDefault() {
            settings = { ...defaultSettings };
            saveSettings();
            applySettingsUI();
            applySettingsToControls();
        }

        // ===== Socket =====
        let socket = null;
        let currentRoom = null;
        let isHost = false;
        let roomState = 'waiting'; // waiting, countdown, playing, ended
        let localPlayerIndex = 0;
        let remotePlayersData = {}; // id -> { x, z, angle, health, alive, name }

        function connectSocket() {
            if (socket) return;
            // Use same origin if served by server.mjs, else fallback
            const url = window.location.origin;
            socket = io(url, { path: '/socket.io' });
            socket.on('connect', () => {
                console.log('Socket connected', socket.id);
                lobbyStatus.textContent = 'Connected.';
                socket.emit('list-rooms', (rooms) => {
                    renderRoomList(rooms);
                });
            });
            socket.on('disconnect', () => {
                console.log('Socket disconnected');
                lobbyStatus.textContent = 'Disconnected. Refresh.';
            });
            socket.on('room-players', (data) => {
                // data: { players: [{id, playerIndex, name, isHost}], host, gameState, gameDuration, killLimit }
                renderRoomListForCurrentRoom(data);
                // Update host status
                isHost = data.host === socket.id;
                roomState = data.gameState;
                // Update remote players list
                const newRemote = new Map();
                for (const p of data.players) {
                    if (p.id !== socket.id) {
                        newRemote.set(p.id, { name: p.name, playerIndex: p.playerIndex, isHost: p.isHost });
                    }
                }
                // Remove old remote meshes
                for (const [id, mesh] of remotePlayers) {
                    if (!newRemote.has(id)) {
                        scene.remove(mesh);
                        remotePlayers.delete(id);
                    }
                }
                // Add new remote meshes
                for (const [id, info] of newRemote) {
                    if (!remotePlayers.has(id)) {
                        const color = 0xff6644; // enemy red
                        const mesh = createHumanoid(color, false);
                        mesh.position.set(0, -0.5, 0);
                        scene.add(mesh);
                        remotePlayers.set(id, { mesh, ...info, x:0, z:0, angle:0, health:100, alive:true });
                    }
                }
            });
            socket.on('world-update', (data) => {
                // data: { players: [{id, playerIndex, name, x, y, angle, facingRight}], bullets, hp, scores }
                // Update remote player positions
                for (const p of data.players) {
                    if (p.id === socket.id) continue;
                    const remote = remotePlayers.get(p.id);
                    if (remote) {
                        remote.x = p.x;
                        remote.z = p.y; // y->z
                        remote.angle = p.angle;
                        remote.mesh.position.set(p.x, -0.5, p.y);
                        remote.mesh.rotation.y = p.angle;
                        // Update health display?
                    }
                }
                // Update bullets (visual only)
                // We'll just spawn a simple sphere for each bullet from server
                // For simplicity, we clear and recreate
                for (const m of bulletMeshes) scene.remove(m);
                bulletMeshes.length = 0;
                const bulletMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff6600, emissiveIntensity: 0.5 });
                for (const b of data.bullets) {
                    const geo = new THREE.SphereGeometry(0.2, 6, 6);
                    const mesh = new THREE.Mesh(geo, bulletMat);
                    mesh.position.set(b.x, 0.2, b.y);
                    scene.add(mesh);
                    bulletMeshes.push(mesh);
                }
                // Update HP
                for (const hp of data.hp) {
                    if (hp.id === socket.id) {
                        player.health = hp.hp;
                        player.alive = hp.alive;
                        hudPlayerHP.textContent = Math.ceil(hp.hp);
                    } else {
                        const remote = remotePlayers.get(hp.id);
                        if (remote) {
                            remote.health = hp.hp;
                            remote.alive = hp.alive;
                            // Update enemy HP display (if it's the first remote? For simplicity, show first remote's HP as enemy)
                            // We'll just show the first remote's health in HUD
                            const enemyRemote = [...remotePlayers.values()][0];
                            if (enemyRemote) {
                                hudEnemyHP.textContent = Math.ceil(enemyRemote.health);
                            }
                        }
                    }
                }
                // Update scores? Not shown in HUD for now.
            });
            socket.on('match-joined', (data) => {
                // data: { room, playerIndex, name, world, scores, hp, killLimit, host, gameState, gameDuration }
                console.log('Joined match', data);
                currentRoom = data.room;
                localPlayerIndex = data.playerIndex;
                player.name = data.name;
                isHost = data.host === socket.id;
                roomState = data.gameState;
                // Initialize remote players from world
                for (const w of data.world) {
                    // world contains other players' state
                    if (!remotePlayers.has(w.id)) {
                        const color = 0xff6644;
                        const mesh = createHumanoid(color, false);
                        mesh.position.set(w.x, -0.5, w.y);
                        scene.add(mesh);
                        remotePlayers.set(w.id, { mesh, name: w.name, playerIndex: w.playerIndex, x: w.x, z: w.y, angle: w.angle, health: 100, alive: true });
                    }
                }
                // HP
                for (const hp of data.hp) {
                    if (hp.id === socket.id) {
                        player.health = hp.hp;
                        player.alive = hp.alive;
                        hudPlayerHP.textContent = Math.ceil(hp.hp);
                    } else {
                        const remote = remotePlayers.get(hp.id);
                        if (remote) {
                            remote.health = hp.hp;
                            remote.alive = hp.alive;
                        }
                    }
                }
                // If game is already playing, switch to playing state
                if (data.gameState === 'playing') {
                    startMatch(data.gameDuration);
                } else if (data.gameState === 'countdown') {
                    // We'll get countdown events separately
                } else if (data.gameState === 'waiting') {
                    // Show lobby
                }
                // Show lobby/hide menu
                lobby.classList.add('hidden');
                menu.classList.add('hidden');
                // Show HUD and controls
                controlsOverlay.classList.add('active');
                // Start game loop
                gameState = STATE.PLAYING; // temporary
            });
            socket.on('countdown', (data) => {
                // data: { seconds }
                if (data.seconds > 0) {
                    countdown = data.seconds;
                    gameState = STATE.COUNTDOWN;
                } else {
                    // Game start
                    gameState = STATE.PLAYING;
                    // Start timer
                    // We'll get game-start event
                }
            });
            socket.on('game-start', (data) => {
                // data: { gameDuration, killLimit, startTime }
                startMatch(data.gameDuration);
            });
            socket.on('match-end', (data) => {
                // data: { winnerId, scores, rankings, gameDuration }
                gameState = STATE.GAMEOVER;
                controlsOverlay.classList.remove('active');
                showGameOver(data);
            });
            socket.on('player-left', (id) => {
                const remote = remotePlayers.get(id);
                if (remote) {
                    scene.remove(remote.mesh);
                    remotePlayers.delete(id);
                }
            });
            socket.on('fx-shot', (data) => {
                // data: { id, x, y, angle }
                // Visual effect: spawn a small flash
                const geo = new THREE.SphereGeometry(0.3, 6, 6);
                const mat = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffaa00, emissiveIntensity: 1 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(data.x, 0.2, data.y);
                scene.add(mesh);
                setTimeout(() => { scene.remove(mesh); }, 200);
            });
        }

        function renderRoomList(rooms) {
            roomList.innerHTML = '';
            if (rooms.length === 0) {
                const div = document.createElement('div');
                div.textContent = 'No rooms. Create one!';
                div.style.color = '#8899bb';
                div.style.padding = '12px';
                roomList.appendChild(div);
                return;
            }
            for (const r of rooms) {
                const div = document.createElement('div');
                div.className = 'room-item';
                div.innerHTML = `
                    <span class="name">${r.name}</span>
                    <span class="players">${r.players}/6</span>
                    <span class="status">${r.gameState === 'playing' ? '🔴 Playing' : r.gameState === 'countdown' ? '⏳ Starting' : '🟢 Waiting'}</span>
                `;
                div.addEventListener('click', () => {
                    joinRoom(r.name);
                });
                roomList.appendChild(div);
            }
        }

        function renderRoomListForCurrentRoom(data) {
            // Not used for listing, but we could update the room list item if needed
        }

        function joinRoom(name) {
            if (!socket) return;
            socket.emit('join-room', name, (res) => {
                if (res && res.ok) {
                    lobbyStatus.textContent = `Joined room: ${res.room}`;
                    // The match-joined event will handle the rest
                } else {
                    lobbyStatus.textContent = 'Failed to join room.';
                }
            });
        }

        function startMatch(duration) {
            matchTime = duration || 600;
            gameState = STATE.PLAYING;
            // Start timer countdown
            if (matchTimerInterval) clearInterval(matchTimerInterval);
            matchTimerInterval = setInterval(() => {
                matchTime--;
                hudTimer.textContent = Math.ceil(matchTime);
                if (matchTime <= 0) {
                    clearInterval(matchTimerInterval);
                    // Match end will be triggered by server
                }
            }, 1000);
        }

        function showGameOver(data) {
            // data: { winnerId, scores, rankings, gameDuration }
            const winner = data.rankings && data.rankings.length > 0 ? data.rankings[0] : null;
            const isWinner = winner && winner.id === socket.id;
            gameOverTitle.textContent = isWinner ? '🏆 YOU WIN!' : '💀 YOU LOSE';
            gameOverTitle.style.color = isWinner ? '#44ff44' : '#ff4444';
            gameOverSub.textContent = `Score: ${winner ? winner.kills : 0} kills`;
            gameOverMenu.classList.remove('hidden');
        }

        // ===== Game loop update =====
        function update() {
            if (gameState !== STATE.PLAYING) return;

            // Movement
            let dx = 0, dz = 0;
            if (keys.w) dz -= player.speed;
            if (keys.s) dz += player.speed;
            if (keys.a) dx -= player.speed;
            if (keys.d) dx += player.speed;
            if (joystickActive) {
                const mag = Math.hypot(joystickDX, joystickDY);
                if (mag > 0.1) {
                    const normDX = joystickDX / mag;
                    const normDY = joystickDY / mag;
                    const speed = Math.min(mag, 1) * player.speed;
                    dx += normDX * speed;
                    dz += normDY * speed;
                }
            }
            if (dx !== 0 || dz !== 0) {
                const len = Math.hypot(dx, dz);
                dx = dx / len * Math.min(len, player.speed);
                dz = dz / len * Math.min(len, player.speed);
                player.x += dx;
                player.z += dz;
                // Clamp
                player.x = Math.max(-BOUNDS, Math.min(BOUNDS, player.x));
                player.z = Math.max(-BOUNDS, Math.min(BOUNDS, player.z));
                player.mesh.position.set(player.x, -0.5, player.z);
            }

            // Aim: mouse to ground
            if (!touchFire) {
                const rect = renderer.domElement.getBoundingClientRect();
                const ndcX = ((mouseX - rect.left) / rect.width) * 2 - 1;
                const ndcY = -((mouseY - rect.top) / rect.height) * 2 + 1;
                const vector = new THREE.Vector3(ndcX, ndcY, 0.5);
                vector.unproject(camera);
                const dir = vector.sub(camera.position).normalize();
                const distance = -camera.position.y / dir.y;
                const pos = camera.position.clone().add(dir.multiplyScalar(distance));
                player.angle = Math.atan2(pos.z - player.z, pos.x - player.x);
                player.mesh.rotation.y = player.angle;
            }

            // Shooting
            const now = Date.now();
            if (touchFire && player.alive) {
                // Auto-aim at nearest remote player
                let target = null;
                let minDist = Infinity;
                for (const [id, remote] of remotePlayers) {
                    if (!remote.alive) continue;
                    const d = Math.hypot(remote.x - player.x, remote.z - player.z);
                    if (d < minDist) { minDist = d; target = remote; }
                }
                if (target) {
                    player.angle = Math.atan2(target.z - player.z, target.x - player.x);
                    player.mesh.rotation.y = player.angle;
                    if (now - player.cooldown > player.shootCooldown) {
                        // Send fire event
                        socket.emit('player-fire', {
                            x: player.x,
                            y: player.z,
                            angle: player.angle,
                            weapon: 'SCRAP_RIFLE'
                        });
                        player.cooldown = now;
                        // Visual feedback: flash
                    }
                }
            }

            // Send state to server
            if (socket && gameState === STATE.PLAYING) {
                socket.emit('player-state', {
                    x: player.x,
                    y: player.z,
                    angle: player.angle,
                    facingRight: true,
                });
            }

            // Update HUD
            hudPlayerHP.textContent = Math.ceil(player.health);
            // Enemy HP is updated via server events
        }

        // ===== Animation loop =====
        function animate() {
            requestAnimationFrame(animate);
            update();
            // Camera follows player
            if (gameState === STATE.PLAYING || gameState === STATE.COUNTDOWN) {
                const targetX = player.x;
                const targetZ = player.z;
                camera.position.x = targetX;
                camera.position.z = targetZ + 20;
                camera.position.y = 15;
                camera.lookAt(targetX, 0, targetZ);
            } else {
                camera.position.set(0, 25, 25);
                camera.lookAt(0, 0, 0);
            }
            renderer.render(scene, camera);
        }
        animate();

        // ===== Event Listeners =====

        // Keyboard
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = true;
                e.preventDefault();
            }
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = false;
                e.preventDefault();
            }
        });

        // Mouse
        renderer.domElement.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        renderer.domElement.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                mouseDown = true;
                // For desktop, we can also fire a shot on click
                if (gameState === STATE.PLAYING && player.alive) {
                    // Fire at mouse aim point
                    const rect = renderer.domElement.getBoundingClientRect();
                    const ndcX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                    const ndcY = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                    const vector = new THREE.Vector3(ndcX, ndcY, 0.5);
                    vector.unproject(camera);
                    const dir = vector.sub(camera.position).normalize();
                    const distance = -camera.position.y / dir.y;
                    const pos = camera.position.clone().add(dir.multiplyScalar(distance));
                    player.angle = Math.atan2(pos.z - player.z, pos.x - player.x);
                    player.mesh.rotation.y = player.angle;
                    // Send fire
                    if (Date.now() - player.cooldown > player.shootCooldown) {
                        socket.emit('player-fire', {
                            x: player.x,
                            y: player.z,
                            angle: player.angle,
                            weapon: 'SCRAP_RIFLE'
                        });
                        player.cooldown = Date.now();
                    }
                }
                e.preventDefault();
            }
        });
        renderer.domElement.addEventListener('mouseup', (e) => {
            if (e.button === 0) mouseDown = false;
        });
        renderer.domElement.addEventListener('mouseleave', () => { mouseDown = false; });
        renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

        // Touch joystick
        function handleJoystickStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            if (!touch) return;
            const rect = moveJoystickBase.getBoundingClientRect();
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;
            const dx = touch.clientX - cx;
            const dy = touch.clientY - cy;
            const maxRadius = rect.width/2;
            const mag = Math.hypot(dx, dy);
            const clampedMag = Math.min(mag, maxRadius);
            const angle = Math.atan2(dy, dx);
            const thumbX = clampedMag * Math.cos(angle);
            const thumbY = clampedMag * Math.sin(angle);
            moveJoystickThumb.style.transform = `translate(${thumbX - 25}px, ${thumbY - 25}px)`;
            joystickActive = true;
            joystickDX = dx / maxRadius;
            joystickDY = dy / maxRadius;
            const clamp = (v) => Math.min(1, Math.max(-1, v));
            joystickDX = clamp(joystickDX);
            joystickDY = clamp(joystickDY);
        }
        function handleJoystickMove(e) {
            e.preventDefault();
            const touch = e.touches[0];
            if (!touch) return;
            const rect = moveJoystickBase.getBoundingClientRect();
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;
            const dx = touch.clientX - cx;
            const dy = touch.clientY - cy;
            const maxRadius = rect.width/2;
            const mag = Math.hypot(dx, dy);
            const clampedMag = Math.min(mag, maxRadius);
            const angle = Math.atan2(dy, dx);
            const thumbX = clampedMag * Math.cos(angle);
            const thumbY = clampedMag * Math.sin(angle);
            moveJoystickThumb.style.transform = `translate(${thumbX - 25}px, ${thumbY - 25}px)`;
            joystickActive = true;
            joystickDX = dx / maxRadius;
            joystickDY = dy / maxRadius;
            const clamp = (v) => Math.min(1, Math.max(-1, v));
            joystickDX = clamp(joystickDX);
            joystickDY = clamp(joystickDY);
        }
        function handleJoystickEnd(e) {
            e.preventDefault();
            moveJoystickThumb.style.transform = 'translate(-50%, -50%)';
            joystickActive = false;
            joystickDX = 0;
            joystickDY = 0;
        }
        moveJoystickArea.addEventListener('touchstart', handleJoystickStart);
        moveJoystickArea.addEventListener('touchmove', handleJoystickMove);
        moveJoystickArea.addEventListener('touchend', handleJoystickEnd);
        moveJoystickArea.addEventListener('touchcancel', handleJoystickEnd);

        // Fire button
        fireBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchFire = true;
        });
        fireBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            touchFire = false;
        });
        fireBtn.addEventListener('touchcancel', (e) => { touchFire = false; });
        fireBtn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            touchFire = true;
        });
        fireBtn.addEventListener('mouseup', (e) => {
            e.preventDefault();
            touchFire = false;
        });

        // Settings
        settingsBtn.addEventListener('click', () => {
            settingsPanel.classList.toggle('show');
        });
        settingsBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            settingsPanel.classList.toggle('show');
        });
        settingsCloseBtn.addEventListener('click', () => {
            settingsPanel.classList.remove('show');
        });
        settingsCloseBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            settingsPanel.classList.remove('show');
        });
        resetSettingsBtn.addEventListener('click', resetSettingsToDefault);
        resetSettingsBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            resetSettingsToDefault();
        });

        // Size buttons
        function updateSetting(key, delta, displayEl) {
            const newVal = Math.max(10, Math.min(50, settings[key] + delta));
            settings[key] = newVal;
            displayEl.textContent = newVal + '%';
            saveSettings();
            applySettingsToControls();
        }
        joyDec.addEventListener('click', () => updateSetting('joySize', -2, joySizeVal));
        joyInc.addEventListener('click', () => updateSetting('joySize', 2, joySizeVal));
        fireDec.addEventListener('click', () => updateSetting('fireSize', -2, fireSizeVal));
        fireInc.addEventListener('click', () => updateSetting('fireSize', 2, fireSizeVal));

        // Menu buttons
        playBtn.addEventListener('click', () => {
            // Local vs bot - we'll keep the existing bot mode from phase 2
            // For now, just alert
            alert('Bot mode coming soon. Use Online Multiplayer.');
        });
        multiBtn.addEventListener('click', () => {
            menu.classList.add('hidden');
            lobby.classList.remove('hidden');
            connectSocket();
            socket.emit('list-rooms', (rooms) => {
                renderRoomList(rooms);
            });
        });
        backToMenuBtn.addEventListener('click', () => {
            lobby.classList.add('hidden');
            menu.classList.remove('hidden');
            if (socket) {
                socket.emit('leave-room');
                socket.disconnect();
                socket = null;
            }
            // Clear remote players
            for (const [id, remote] of remotePlayers) {
                scene.remove(remote.mesh);
            }
            remotePlayers.clear();
        });
        createRoomBtn.addEventListener('click', () => {
            const name = nameInput.value.trim() || 'Player';
            socket.emit('set-name', name);
            const roomName = 'room_' + Math.random().toString(36).substr(2, 6);
            socket.emit('join-room', roomName, (res) => {
                if (res && res.ok) {
                    lobbyStatus.textContent = `Created room: ${roomName}`;
                } else {
                    lobbyStatus.textContent = 'Failed to create room.';
                }
            });
        });
        refreshRoomsBtn.addEventListener('click', () => {
            socket.emit('list-rooms', (rooms) => {
                renderRoomList(rooms);
            });
        });

        // Game Over return
        gameOverReturnBtn.addEventListener('click', () => {
            gameOverMenu.classList.add('hidden');
            menu.classList.remove('hidden');
            if (socket) {
                socket.emit('leave-room');
                socket.disconnect();
                socket = null;
            }
            // Reset
            for (const [id, remote] of remotePlayers) {
                scene.remove(remote.mesh);
            }
            remotePlayers.clear();
            controlsOverlay.classList.remove('active');
            gameState = STATE.MENU;
        });

        // Resize
        function resize() {
            const width = container.clientWidth;
            const height = container.clientHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', resize);

        // ===== Init =====
        loadSettings();
        menu.classList.remove('hidden');
        lobby.classList.add('hidden');
        gameOverMenu.classList.add('hidden');
        controlsOverlay.classList.remove('active');
        gameState = STATE.MENU;

        console.log('Sniper Mecha Multiplayer loaded');
    </script>
</body>
</html>
