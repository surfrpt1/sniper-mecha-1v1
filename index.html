<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sniper Mecha 1v1 - BGMI WOW Style</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            border: 2px solid #2a2a4a;
            border-radius: 12px;
            background: #141428;
            box-shadow: 0 0 40px rgba(0, 100, 255, 0.2);
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #aac;
            font-size: 18px;
            background: rgba(10, 10, 30, 0.8);
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid #3a3a6a;
            pointer-events: none;
            text-align: center;
            z-index: 10;
        }
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #8899bb;
            font-size: 14px;
            background: rgba(10, 10, 30, 0.7);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #2a2a4a;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="ui">🔫 SNIPER MECHA 1v1</div>
    <div id="controls">WASD move · Mouse aim · Click to shoot</div>
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Player 1 (human)
        const player = {
            x: 150, y: 300,
            radius: 20,
            speed: 3.5,
            health: 100,
            maxHealth: 100,
            angle: 0,
            cooldown: 0,
            shootCooldown: 40, // frames
            alive: true
        };

        // Player 2 (AI)
        const enemy = {
            x: 750, y: 300,
            radius: 20,
            speed: 2.0,
            health: 100,
            maxHealth: 100,
            angle: 0,
            cooldown: 0,
            shootCooldown: 50,
            alive: true,
            state: 'idle', // idle, chase, retreat
            timer: 0
        };

        // Bullets
        let bullets = [];
        const bulletSpeed = 8;
        const bulletRadius = 4;

        // Obstacles
        const obstacles = [
            { x: 350, y: 200, w: 60, h: 40 },
            { x: 500, y: 380, w: 40, h: 60 },
            { x: 200, y: 450, w: 80, h: 30 },
            { x: 650, y: 100, w: 30, h: 80 },
            { x: 450, y: 280, w: 20, h: 20 }
        ];

        // Keys
        const keys = { w: false, a: false, s: false, d: false };

        // Mouse
        let mouseX = player.x;
        let mouseY = player.y;
        let mouseDown = false;

        // Canvas size
        const W = 900, H = 600;

        // Helper: distance
        function dist(x1, y1, x2, y2) {
            return Math.hypot(x2 - x1, y2 - y1);
        }

        // Check collision with obstacles
        function collidesWithObstacles(x, y, r) {
            for (let o of obstacles) {
                // Circle vs rectangle (approximate)
                const closestX = Math.max(o.x, Math.min(x, o.x + o.w));
                const closestY = Math.max(o.y, Math.min(y, o.y + o.h));
                if (dist(x, y, closestX, closestY) < r) return true;
            }
            return false;
        }

        // Check if a point is inside canvas
        function inCanvas(x, y) {
            return x >= 0 && x <= W && y >= 0 && y <= H;
        }

        // Player movement
        function movePlayer(p, dx, dy) {
            let nx = p.x + dx;
            let ny = p.y + dy;
            // Keep within bounds
            if (nx - p.radius < 0) nx = p.radius;
            if (nx + p.radius > W) nx = W - p.radius;
            if (ny - p.radius < 0) ny = p.radius;
            if (ny + p.radius > H) ny = H - p.radius;
            // Check obstacles
            if (!collidesWithObstacles(nx, ny, p.radius)) {
                p.x = nx;
                p.y = ny;
            } else {
                // Try sliding along axes
                if (!collidesWithObstacles(nx, p.y, p.radius)) {
                    p.x = nx;
                } else if (!collidesWithObstacles(p.x, ny, p.radius)) {
                    p.y = ny;
                }
            }
        }

        // Shoot bullet
        function shoot(shooter, targetX, targetY, isEnemy = false) {
            if (shooter.cooldown > 0) return;
            const angle = Math.atan2(targetY - shooter.y, targetX - shooter.x);
            const speed = bulletSpeed;
            bullets.push({
                x: shooter.x + Math.cos(angle) * (shooter.radius + 4),
                y: shooter.y + Math.sin(angle) * (shooter.radius + 4),
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: bulletRadius,
                isEnemy: isEnemy,
                alive: true
            });
            shooter.cooldown = shooter.shootCooldown;
        }

        // AI logic
        function updateAI() {
            if (!enemy.alive) return;
            // AI aims at player
            enemy.angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);

            // State machine
            const distToPlayer = dist(enemy.x, enemy.y, player.x, player.y);
            if (distToPlayer > 500) {
                enemy.state = 'chase';
            } else if (distToPlayer < 250) {
                enemy.state = 'retreat';
            } else {
                enemy.state = 'idle';
            }

            let dx = 0, dy = 0;
            if (enemy.state === 'chase') {
                dx = Math.cos(enemy.angle) * enemy.speed;
                dy = Math.sin(enemy.angle) * enemy.speed;
            } else if (enemy.state === 'retreat') {
                dx = -Math.cos(enemy.angle) * enemy.speed * 0.7;
                dy = -Math.sin(enemy.angle) * enemy.speed * 0.7;
            } else {
                // idle: strafe a bit
                if (enemy.timer % 120 < 60) {
                    dx = Math.cos(enemy.angle + Math.PI/2) * 0.8;
                    dy = Math.sin(enemy.angle + Math.PI/2) * 0.8;
                } else {
                    dx = Math.cos(enemy.angle - Math.PI/2) * 0.8;
                    dy = Math.sin(enemy.angle - Math.PI/2) * 0.8;
                }
            }
            movePlayer(enemy, dx, dy);

            // Shoot if player in line of sight and angle is close
            if (distToPlayer < 600 && Math.abs(Math.atan2(player.y - enemy.y, player.x - enemy.x) - enemy.angle) < 0.2) {
                shoot(enemy, player.x, player.y, true);
            }

            // Update timer
            enemy.timer++;
        }

        // Update game
        function update() {
            // Cooldowns
            if (player.cooldown > 0) player.cooldown--;
            if (enemy.cooldown > 0) enemy.cooldown--;

            // Player movement
            let dx = 0, dy = 0;
            if (keys.w) dy -= player.speed;
            if (keys.s) dy += player.speed;
            if (keys.a) dx -= player.speed;
            if (keys.d) dx += player.speed;
            if (dx !== 0 || dy !== 0) {
                const len = Math.hypot(dx, dy);
                dx = dx / len * player.speed;
                dy = dy / len * player.speed;
                movePlayer(player, dx, dy);
            }

            // Player aim
            player.angle = Math.atan2(mouseY - player.y, mouseX - player.x);

            // Player shoot
            if (mouseDown && player.alive) {
                shoot(player, mouseX, mouseY, false);
            }

            // Update AI
            updateAI();

            // Update bullets
            for (let b of bullets) {
                if (!b.alive) continue;
                b.x += b.vx;
                b.y += b.vy;
                // Remove if out of canvas
                if (b.x < 0 || b.x > W || b.y < 0 || b.y > H) {
                    b.alive = false;
                    continue;
                }
                // Check obstacle collision
                let hitObstacle = false;
                for (let o of obstacles) {
                    if (b.x >= o.x && b.x <= o.x + o.w && b.y >= o.y && b.y <= o.y + o.h) {
                        hitObstacle = true;
                        break;
                    }
                }
                if (hitObstacle) {
                    b.alive = false;
                    continue;
                }
                // Check hit player/enemy
                if (!b.isEnemy && b.alive && enemy.alive) {
                    if (dist(b.x, b.y, enemy.x, enemy.y) < enemy.radius + b.radius) {
                        enemy.health -= 35;
                        b.alive = false;
                        if (enemy.health <= 0) {
                            enemy.health = 0;
                            enemy.alive = false;
                        }
                        continue;
                    }
                }
                if (b.isEnemy && b.alive && player.alive) {
                    if (dist(b.x, b.y, player.x, player.y) < player.radius + b.radius) {
                        player.health -= 35;
                        b.alive = false;
                        if (player.health <= 0) {
                            player.health = 0;
                            player.alive = false;
                        }
                        continue;
                    }
                }
            }

            // Clean dead bullets
            bullets = bullets.filter(b => b.alive);

            // Reset game if one is dead? auto restart after 3 sec
            if (!player.alive || !enemy.alive) {
                // Show winner message and restart
                if (!window.gameOver) {
                    window.gameOver = true;
                    setTimeout(() => {
                        // Reset
                        player.health = player.maxHealth;
                        player.alive = true;
                        player.x = 150; player.y = 300;
                        enemy.health = enemy.maxHealth;
                        enemy.alive = true;
                        enemy.x = 750; enemy.y = 300;
                        bullets = [];
                        window.gameOver = false;
                    }, 2000);
                }
            }
        }

        // Draw
        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Draw grid
            ctx.strokeStyle = '#1a1a3a';
            ctx.lineWidth = 1;
            for (let i = 0; i < W; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, H);
                ctx.stroke();
            }
            for (let i = 0; i < H; i += 40) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(W, i);
                ctx.stroke();
            }

            // Draw obstacles
            ctx.fillStyle = '#2a2a5a';
            ctx.shadowColor = '#4a4a8a';
            ctx.shadowBlur = 10;
            for (let o of obstacles) {
                ctx.fillRect(o.x, o.y, o.w, o.h);
            }
            ctx.shadowBlur = 0;

            // Draw bullets
            for (let b of bullets) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = b.isEnemy ? '#ff6666' : '#66ff66';
                ctx.shadowColor = b.isEnemy ? '#ff0000' : '#00ff00';
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Draw players (mechs)
            function drawMech(p, color, isEnemy = false) {
                if (!p.alive) return;
                ctx.save();
                ctx.translate(p.x, p.y);
                // Body
                const grad = ctx.createRadialGradient(0, 0, 5, 0, 0, p.radius);
                grad.addColorStop(0, color);
                grad.addColorStop(1, '#1a1a2a');
                ctx.fillStyle = grad;
                ctx.shadowColor = color;
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                // Gun (sniper barrel)
                ctx.rotate(p.angle);
                ctx.fillStyle = '#888';
                ctx.fillRect(p.radius - 5, -4, 30, 8);
                ctx.fillStyle = '#aaa';
                ctx.fillRect(p.radius + 20, -2, 10, 4);
                // Scope indicator
                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.arc(p.radius - 2, 0, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Health bar
                const barW = 50;
                const barH = 6;
                const barX = p.x - barW/2;
                const barY = p.y - p.radius - 18;
                ctx.fillStyle = '#333';
                ctx.fillRect(barX, barY, barW, barH);
                const healthPct = p.health / p.maxHealth;
                ctx.fillStyle = healthPct > 0.5 ? '#44ff44' : '#ff4444';
                ctx.fillRect(barX, barY, barW * healthPct, barH);
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 1;
                ctx.strokeRect(barX, barY, barW, barH);
            }

            drawMech(player, '#44aaff', false);
            drawMech(enemy, '#ff6644', true);

            // Crosshair
            ctx.strokeStyle = '#ff4444';
            ctx.lineWidth = 2;
            const cx = mouseX, cy = mouseY;
            const size = 12;
            ctx.beginPath();
            ctx.moveTo(cx - size, cy);
            ctx.lineTo(cx - 4, cy);
            ctx.moveTo(cx + 4, cy);
            ctx.lineTo(cx + size, cy);
            ctx.moveTo(cx, cy - size);
            ctx.lineTo(cx, cy - 4);
            ctx.moveTo(cx, cy + 4);
            ctx.lineTo(cx, cy + size);
            ctx.stroke();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.beginPath();
            ctx.arc(cx, cy, 12, 0, Math.PI * 2);
            ctx.stroke();

            // Status
            ctx.fillStyle = '#aac';
            ctx.font = '16px monospace';
            ctx.fillText(`Player HP: ${Math.ceil(player.health)}`, 20, 40);
            ctx.fillText(`Enemy HP: ${Math.ceil(enemy.health)}`, 20, 70);

            if (!player.alive) {
                ctx.fillStyle = '#ff4444';
                ctx.font = '48px sans-serif';
                ctx.fillText('YOU LOSE', W/2 - 120, H/2 - 20);
            }
            if (!enemy.alive) {
                ctx.fillStyle = '#44ff44';
                ctx.font = '48px sans-serif';
                ctx.fillText('YOU WIN!', W/2 - 120, H/2 - 20);
            }
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Event listeners
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = true;
                e.preventDefault();
            }
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = false;
                e.preventDefault();
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            mouseX = (e.clientX - rect.left) * scaleX;
            mouseY = (e.clientY - rect.top) * scaleY;
            // Clamp
            mouseX = Math.max(0, Math.min(W, mouseX));
            mouseY = Math.max(0, Math.min(H, mouseY));
        });

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                mouseDown = true;
                e.preventDefault();
            }
        });
        canvas.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                mouseDown = false;
                e.preventDefault();
            }
        });
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // Start
        gameLoop();
    </script>
</body>
</html>
