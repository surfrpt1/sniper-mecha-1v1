<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sniper Mecha 1v1 - 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-touch-callout: none; touch-action: none; }
        body {
            background: #0a0a1a;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #gameWrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0a1a;
        }
        #three-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Menu overlay */
        #menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 30, 0.85);
            backdrop-filter: blur(6px);
            z-index: 20;
            pointer-events: auto;
            transition: opacity 0.3s;
        }
        #menu.hidden { opacity: 0; pointer-events: none; }
        #menu h1 {
            font-size: clamp(2rem, 8vw, 4rem);
            color: #88ccff;
            text-shadow: 0 0 20px #44aaff;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        #menu p {
            color: #8899bb;
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            margin-bottom: 30px;
        }
        .menu-btn {
            background: #1a2a4a;
            border: 2px solid #3a6a9a;
            color: #ccddff;
            font-size: clamp(1rem, 3vw, 1.6rem);
            padding: 12px 28px;
            margin: 10px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            min-width: 160px;
            text-align: center;
            font-weight: 600;
            letter-spacing: 1px;
            touch-action: manipulation;
        }
        .menu-btn:hover { background: #2a4a7a; border-color: #6a9aff; transform: scale(1.03); }
        .menu-btn:active { transform: scale(0.97); }
        .menu-btn.disabled { opacity: 0.4; cursor: not-allowed; border-color: #3a3a4a; }

        /* HUD */
        #hud {
            position: absolute;
            top: 10px; left: 10px;
            color: #aac;
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            font-family: monospace;
            z-index: 15;
            pointer-events: none;
            text-shadow: 0 0 10px #000;
            line-height: 1.6;
        }
        #hud .timer { font-size: clamp(1rem, 3vw, 1.6rem); color: #ffcc44; }
        #settingsBtn {
            position: absolute;
            top: 12px; right: 12px;
            z-index: 16;
            background: rgba(0,0,0,0.5);
            border: 1px solid #3a5a7a;
            color: #ccddff;
            border-radius: 50%;
            width: clamp(28px, 4vw, 36px);
            height: clamp(28px, 4vw, 36px);
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            touch-action: manipulation;
            transition: 0.2s;
        }
        #settingsBtn:hover { background: rgba(30,60,100,0.7); }
        #settingsBtn:active { transform: scale(0.9); }

        /* Settings panel (simplified for 3D) */
        #settingsPanel {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: min(90%, 400px);
            background: rgba(10,10,30,0.95);
            border: 2px solid #3a5a8a;
            border-radius: 20px;
            padding: 24px 20px;
            z-index: 30;
            display: none;
            flex-direction: column;
            gap: 16px;
            backdrop-filter: blur(8px);
            pointer-events: auto;
        }
        #settingsPanel.show { display: flex; }
        #settingsPanel h2 { color: #88ccff; font-size: 1.4rem; text-align: center; }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #aac;
            font-size: 0.95rem;
        }
        .setting-row input[type="range"] {
            width: 60%;
            accent-color: #44aaff;
            background: #1a2a3a;
            height: 4px;
            border-radius: 4px;
            -webkit-appearance: none;
        }
        .setting-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #44aaff;
            cursor: pointer;
        }
        .setting-row span { min-width: 30px; text-align: right; color: #88ccff; }
        .settings-close-btn {
            background: #2a3a5a;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 6px;
            touch-action: manipulation;
        }
        .settings-close-btn:active { transform: scale(0.96); }
        .settings-reset-btn {
            background: #3a2a2a;
            border: none;
            color: #ff8866;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            touch-action: manipulation;
        }

        /* Game Over overlay */
        #gameOverMenu {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(4px);
            z-index: 25;
            pointer-events: auto;
        }
        #gameOverMenu.show { display: flex; }
        #gameOverMenu h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            margin-bottom: 10px;
            text-shadow: 0 0 30px currentColor, 0 0 60px #000;
            color: #fff;
        }
        #gameOverMenu .sub {
            color: #ddd;
            font-size: clamp(1rem, 2vw, 1.4rem);
            margin-bottom: 30px;
            text-shadow: 0 0 20px #000;
        }
        #gameOverMenu .menu-btn {
            min-width: 160px;
            font-size: clamp(1rem, 2vw, 1.2rem);
            padding: 12px 28px;
        }

        /* Touch controls overlay (keep for mobile) */
        #controlsOverlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            touch-action: none;
        }

        .joystick-area {
            position: absolute;
            width: 30%;
            aspect-ratio: 1/1;
            bottom: 8%; left: 5%;
            pointer-events: auto;
            touch-action: none;
            transition: all 0.1s;
        }
        .joystick-base {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.15);
            position: relative;
            touch-action: none;
        }
        .joystick-thumb {
            width: 45%; height: 45%;
            border-radius: 50%;
            background: rgba(100,180,255,0.5);
            border: 2px solid rgba(100,180,255,0.8);
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            touch-action: none;
            transition: none;
        }
        .fire-btn {
            position: absolute;
            width: 18%;
            aspect-ratio: 1/1;
            bottom: 10%; right: 8%;
            border-radius: 50%;
            background: radial-gradient(circle, #ff6644, #cc2200);
            border: 3px solid #ffaa44;
            color: white;
            font-size: clamp(1.2rem, 4vw, 2.2rem);
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: manipulation;
            box-shadow: 0 0 30px rgba(255,50,0,0.5);
            cursor: pointer;
            text-shadow: 0 0 10px rgba(255,255,200,0.8);
            user-select: none;
            transition: all 0.1s;
        }
        .fire-btn:active { transform: scale(0.92); box-shadow: 0 0 50px rgba(255,50,0,0.8); }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <div id="three-canvas"></div>

        <!-- Menu -->
        <div id="menu">
            <h1>🔫 SNIPER MECHA 3D</h1>
            <p>1v1 · BGMI WOW Style</p>
            <button class="menu-btn" id="playBtn">▶ Play vs Bot</button>
            <button class="menu-btn disabled" id="multiBtn">🌐 Online (coming soon)</button>
        </div>

        <!-- Game Over -->
        <div id="gameOverMenu">
            <h1 id="gameOverTitle">🏆 YOU WIN!</h1>
            <div class="sub" id="gameOverSub">Match over</div>
            <button class="menu-btn" id="gameOverReturnBtn">↩ Return to Menu</button>
        </div>

        <!-- HUD -->
        <div id="hud">
            <div>HP: <span id="hudPlayerHP">100</span></div>
            <div>Enemy: <span id="hudEnemyHP">100</span></div>
            <div class="timer">⏱ <span id="hudTimer">60</span>s</div>
        </div>

        <!-- Settings Button -->
        <div id="settingsBtn">⚙</div>
        <div id="settingsPanel">
            <h2>⚙ Controls</h2>
            <div class="setting-row">
                <label>Joystick size</label>
                <input type="range" id="joySizeSlider" min="15" max="45" value="30" step="1" />
                <span id="joySizeVal">30%</span>
            </div>
            <div class="setting-row">
                <label>Fire button size</label>
                <input type="range" id="fireSizeSlider" min="10" max="30" value="18" step="1" />
                <span id="fireSizeVal">18%</span>
            </div>
            <div class="setting-row">
                <label>Joystick X offset</label>
                <input type="range" id="joyXSlider" min="0" max="20" value="5" step="0.5" />
                <span id="joyXVal">5%</span>
            </div>
            <div class="setting-row">
                <label>Joystick Y offset</label>
                <input type="range" id="joyYSlider" min="0" max="20" value="8" step="0.5" />
                <span id="joyYVal">8%</span>
            </div>
            <div class="setting-row">
                <label>Fire X offset</label>
                <input type="range" id="fireXSlider" min="0" max="20" value="8" step="0.5" />
                <span id="fireXVal">8%</span>
            </div>
            <div class="setting-row">
                <label>Fire Y offset</label>
                <input type="range" id="fireYSlider" min="0" max="20" value="10" step="0.5" />
                <span id="fireYVal">10%</span>
            </div>
            <button class="settings-reset-btn" id="resetSettingsBtn">↺ Reset to default</button>
            <button class="settings-close-btn" id="settingsCloseBtn">Close</button>
        </div>

        <!-- Touch Controls -->
        <div id="controlsOverlay">
            <div class="joystick-area" id="moveJoystickArea">
                <div class="joystick-base" id="moveJoystickBase">
                    <div class="joystick-thumb" id="moveJoystickThumb"></div>
                </div>
            </div>
            <div class="fire-btn" id="fireBtn">🔥</div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ===== DOM refs =====
        const container = document.getElementById('three-canvas');
        const menu = document.getElementById('menu');
        const playBtn = document.getElementById('playBtn');
        const multiBtn = document.getElementById('multiBtn');
        const hudPlayerHP = document.getElementById('hudPlayerHP');
        const hudEnemyHP = document.getElementById('hudEnemyHP');
        const hudTimer = document.getElementById('hudTimer');
        const controlsOverlay = document.getElementById('controlsOverlay');
        const moveJoystickArea = document.getElementById('moveJoystickArea');
        const moveJoystickBase = document.getElementById('moveJoystickBase');
        const moveJoystickThumb = document.getElementById('moveJoystickThumb');
        const fireBtn = document.getElementById('fireBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const settingsCloseBtn = document.getElementById('settingsCloseBtn');
        const resetSettingsBtn = document.getElementById('resetSettingsBtn');
        const gameOverMenu = document.getElementById('gameOverMenu');
        const gameOverTitle = document.getElementById('gameOverTitle');
        const gameOverSub = document.getElementById('gameOverSub');
        const gameOverReturnBtn = document.getElementById('gameOverReturnBtn');

        // Settings sliders
        const joySizeSlider = document.getElementById('joySizeSlider');
        const fireSizeSlider = document.getElementById('fireSizeSlider');
        const joyXSlider = document.getElementById('joyXSlider');
        const joyYSlider = document.getElementById('joyYSlider');
        const fireXSlider = document.getElementById('fireXSlider');
        const fireYSlider = document.getElementById('fireYSlider');
        const joySizeVal = document.getElementById('joySizeVal');
        const fireSizeVal = document.getElementById('fireSizeVal');
        const joyXVal = document.getElementById('joyXVal');
        const joyYVal = document.getElementById('joyYVal');
        const fireXVal = document.getElementById('fireXVal');
        const fireYVal = document.getElementById('fireYVal');

        // ===== Three.js setup =====
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);

        // Camera
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 25, 25);
        camera.lookAt(0, 0, 0);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);
        const fillLight = new THREE.DirectionalLight(0x4488ff, 0.3);
        fillLight.position.set(-10, 5, -10);
        scene.add(fillLight);

        // Ground
        const groundGeo = new THREE.PlaneGeometry(40, 40);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x141428, roughness: 0.7, metalness: 0.1 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.5;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid helper
        const gridHelper = new THREE.GridHelper(40, 20, 0x2a2a5a, 0x1a1a3a);
        gridHelper.position.y = -0.4;
        scene.add(gridHelper);

        // ===== Game state =====
        const STATE = { MENU: 0, COUNTDOWN: 1, PLAYING: 2, GAMEOVER: 3 };
        let gameState = STATE.MENU;
        let countdown = 3;
        let matchTime = 60;
        let matchTimerInterval = null;
        let gameOverWinner = null;

        // Arena bounds
        const BOUNDS = 18;

        // ===== Players =====
        const player = {
            x: -6, z: 0,
            radius: 1.2,
            speed: 0.07,
            health: 100,
            maxHealth: 100,
            angle: 0,
            cooldown: 0,
            shootCooldown: 40,
            alive: true,
            mesh: null,
            aimTarget: new THREE.Vector3(0, 0, 1)
        };
        const enemy = {
            x: 6, z: 0,
            radius: 1.2,
            speed: 0.04,
            health: 100,
            maxHealth: 100,
            angle: 0,
            cooldown: 0,
            shootCooldown: 50,
            alive: true,
            state: 'idle',
            timer: 0,
            mesh: null
        };

        // Bullets
        let bullets = [];
        const bulletSpeed = 0.2;
        const bulletRadius = 0.2;

        // Obstacles (3D boxes)
        const obstacles = [
            { x: -3, z: -3, w: 2, h: 1.5, d: 2 },
            { x: 4, z: 2, w: 2, h: 1.5, d: 2 },
            { x: -5, z: 5, w: 2, h: 1.5, d: 2 },
            { x: 6, z: -4, w: 2, h: 1.5, d: 2 },
            { x: 0, z: 0, w: 1.5, h: 1.5, d: 1.5 }
        ];
        const obstacleMeshes = [];

        function createObstacles() {
            for (let o of obstacles) {
                const geo = new THREE.BoxGeometry(o.w, o.h, o.d);
                const mat = new THREE.MeshStandardMaterial({ color: 0x2a2a5a, roughness: 0.6, metalness: 0.2 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(o.x, o.h/2 - 0.5, o.z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
                obstacleMeshes.push(mesh);
            }
        }
        createObstacles();

        // ===== Create humanoid character =====
        function createHumanoid(color, isEnemy = false) {
            const group = new THREE.Group();

            // Body (cylinder)
            const bodyGeo = new THREE.CylinderGeometry(0.7, 0.7, 1.4, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4, metalness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.7;
            body.castShadow = true;
            group.add(body);

            // Head (sphere)
            const headGeo = new THREE.SphereGeometry(0.5, 8, 8);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc99, roughness: 0.6 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.6;
            head.castShadow = true;
            group.add(head);

            // Arms (boxes)
            const armMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5 });
            const armGeo = new THREE.BoxGeometry(0.2, 1.0, 0.2);
            const armL = new THREE.Mesh(armGeo, armMat);
            armL.position.set(-0.8, 0.9, 0);
            armL.castShadow = true;
            group.add(armL);
            const armR = new THREE.Mesh(armGeo, armMat);
            armR.position.set(0.8, 0.9, 0);
            armR.castShadow = true;
            group.add(armR);

            // Legs
            const legMat = new THREE.MeshStandardMaterial({ color: 0x333366, roughness: 0.6 });
            const legGeo = new THREE.BoxGeometry(0.3, 0.8, 0.3);
            const legL = new THREE.Mesh(legGeo, legMat);
            legL.position.set(-0.3, 0.1, 0);
            legL.castShadow = true;
            group.add(legL);
            const legR = new THREE.Mesh(legGeo, legMat);
            legR.position.set(0.3, 0.1, 0);
            legR.castShadow = true;
            group.add(legR);

            // Sniper rifle (for right arm)
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.3, metalness: 0.7 });
            const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.15, 0.15), gunMat);
            gunBody.position.set(0.7, 0.2, 0.6);
            group.add(gunBody);
            const gunBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.6), gunMat);
            gunBarrel.rotation.x = Math.PI/2;
            gunBarrel.position.set(0.7, 0.2, 1.0);
            group.add(gunBarrel);

            // Scope
            const scopeMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0xffaa00, emissiveIntensity: 0.3 });
            const scope = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), scopeMat);
            scope.position.set(0.7, 0.35, 0.8);
            group.add(scope);

            group.scale.set(0.6, 0.6, 0.6);
            return group;
        }

        // Create player and enemy meshes
        const playerGroup = createHumanoid(0x44aaff);
        playerGroup.position.set(player.x, -0.5, player.z);
        scene.add(playerGroup);
        player.mesh = playerGroup;

        const enemyGroup = createHumanoid(0xff6644, true);
        enemyGroup.position.set(enemy.x, -0.5, enemy.z);
        scene.add(enemyGroup);
        enemy.mesh = enemyGroup;

        // ===== Input =====
        const keys = { w: false, a: false, s: false, d: false };
        let mouseX = 0, mouseY = 0;
        let mouseDown = false;
        let joystickActive = false;
        let joystickDX = 0, joystickDY = 0;
        let touchFire = false;

        // ===== Settings =====
        const defaultSettings = {
            joySize: 30, fireSize: 18,
            joyX: 5, joyY: 8,
            fireX: 8, fireY: 10
        };
        let settings = { ...defaultSettings };

        function loadSettings() {
            try {
                const stored = JSON.parse(localStorage.getItem('sniperMechaSettings'));
                if (stored) {
                    for (let key in defaultSettings) {
                        if (stored[key] !== undefined) settings[key] = stored[key];
                    }
                }
            } catch(e) {}
            applySettingsUI();
            applySettingsToControls();
        }
        function saveSettings() {
            localStorage.setItem('sniperMechaSettings', JSON.stringify(settings));
        }
        function applySettingsUI() {
            joySizeSlider.value = settings.joySize;
            fireSizeSlider.value = settings.fireSize;
            joyXSlider.value = settings.joyX;
            joyYSlider.value = settings.joyY;
            fireXSlider.value = settings.fireX;
            fireYSlider.value = settings.fireY;
            joySizeVal.textContent = settings.joySize + '%';
            fireSizeVal.textContent = settings.fireSize + '%';
            joyXVal.textContent = settings.joyX + '%';
            joyYVal.textContent = settings.joyY + '%';
            fireXVal.textContent = settings.fireX + '%';
            fireYVal.textContent = settings.fireY + '%';
        }
        function applySettingsToControls() {
            moveJoystickArea.style.width = settings.joySize + '%';
            moveJoystickArea.style.aspectRatio = '1/1';
            moveJoystickArea.style.bottom = settings.joyY + '%';
            moveJoystickArea.style.left = settings.joyX + '%';
            fireBtn.style.width = settings.fireSize + '%';
            fireBtn.style.aspectRatio = '1/1';
            fireBtn.style.bottom = settings.fireY + '%';
            fireBtn.style.right = settings.fireX + '%';
        }
        function resetSettingsToDefault() {
            settings = { ...defaultSettings };
            saveSettings();
            applySettingsUI();
            applySettingsToControls();
        }

        // ===== Helpers =====
        function dist(x1, z1, x2, z2) {
            return Math.hypot(x2 - x1, z2 - z1);
        }

        function collidesWithObstacles(x, z, r) {
            for (let o of obstacles) {
                const halfW = o.w/2, halfD = o.d/2;
                const closestX = Math.max(o.x - halfW, Math.min(x, o.x + halfW));
                const closestZ = Math.max(o.z - halfD, Math.min(z, o.z + halfD));
                if (dist(x, z, closestX, closestZ) < r) return true;
            }
            return false;
        }

        function movePlayer(p, dx, dz) {
            let nx = p.x + dx;
            let nz = p.z + dz;
            if (nx < -BOUNDS) nx = -BOUNDS;
            if (nx > BOUNDS) nx = BOUNDS;
            if (nz < -BOUNDS) nz = -BOUNDS;
            if (nz > BOUNDS) nz = BOUNDS;
            if (!collidesWithObstacles(nx, nz, p.radius)) {
                p.x = nx;
                p.z = nz;
            } else {
                if (!collidesWithObstacles(nx, p.z, p.radius)) {
                    p.x = nx;
                } else if (!collidesWithObstacles(p.x, nz, p.radius)) {
                    p.z = nz;
                }
            }
            // Update mesh position
            if (p.mesh) {
                p.mesh.position.x = p.x;
                p.mesh.position.z = p.z;
                // Rotate to face angle
                p.mesh.rotation.y = p.angle;
            }
        }

        function shoot(shooter, targetX, targetZ, isEnemy = false) {
            if (shooter.cooldown > 0) return;
            const angle = Math.atan2(targetZ - shooter.z, targetX - shooter.x);
            const speed = bulletSpeed;
            const b = {
                x: shooter.x + Math.cos(angle) * (shooter.radius + 0.5),
                z: shooter.z + Math.sin(angle) * (shooter.radius + 0.5),
                vx: Math.cos(angle) * speed,
                vz: Math.sin(angle) * speed,
                radius: bulletRadius,
                isEnemy: isEnemy,
                alive: true,
                mesh: null
            };
            // Create visual sphere
            const geo = new THREE.SphereGeometry(bulletRadius, 6, 6);
            const mat = new THREE.MeshStandardMaterial({
                color: isEnemy ? 0xff6666 : 0x66ff66,
                emissive: isEnemy ? 0xff0000 : 0x00ff00,
                emissiveIntensity: 0.5
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(b.x, 0.2, b.z);
            mesh.castShadow = true;
            scene.add(mesh);
            b.mesh = mesh;
            bullets.push(b);
            shooter.cooldown = shooter.shootCooldown;
        }

        // ===== AI =====
        function updateAI() {
            if (!enemy.alive) return;
            enemy.angle = Math.atan2(player.z - enemy.z, player.x - enemy.x);
            const distToPlayer = dist(enemy.x, enemy.z, player.x, player.z);
            if (distToPlayer > 10) enemy.state = 'chase';
            else if (distToPlayer < 4) enemy.state = 'retreat';
            else enemy.state = 'idle';

            let dx = 0, dz = 0;
            if (enemy.state === 'chase') {
                dx = Math.cos(enemy.angle) * enemy.speed;
                dz = Math.sin(enemy.angle) * enemy.speed;
            } else if (enemy.state === 'retreat') {
                dx = -Math.cos(enemy.angle) * enemy.speed * 0.7;
                dz = -Math.sin(enemy.angle) * enemy.speed * 0.7;
            } else {
                if (enemy.timer % 120 < 60) {
                    dx = Math.cos(enemy.angle + Math.PI/2) * 0.5;
                    dz = Math.sin(enemy.angle + Math.PI/2) * 0.5;
                } else {
                    dx = Math.cos(enemy.angle - Math.PI/2) * 0.5;
                    dz = Math.sin(enemy.angle - Math.PI/2) * 0.5;
                }
            }
            movePlayer(enemy, dx, dz);
            if (distToPlayer < 12 && Math.abs(Math.atan2(player.z - enemy.z, player.x - enemy.x) - enemy.angle) < 0.2) {
                shoot(enemy, player.x, player.z, true);
            }
            enemy.timer++;
        }

        // ===== Update =====
        function update() {
            if (gameState !== STATE.PLAYING) return;

            if (player.cooldown > 0) player.cooldown--;
            if (enemy.cooldown > 0) enemy.cooldown--;

            let dx = 0, dz = 0;
            if (keys.w) dz -= player.speed;
            if (keys.s) dz += player.speed;
            if (keys.a) dx -= player.speed;
            if (keys.d) dx += player.speed;
            if (joystickActive) {
                const mag = Math.hypot(joystickDX, joystickDY);
                if (mag > 0.1) {
                    const normDX = joystickDX / mag;
                    const normDY = joystickDY / mag;
                    const speed = Math.min(mag, 1) * player.speed;
                    dx += normDX * speed;
                    dz += normDY * speed;
                }
            }
            if (dx !== 0 || dz !== 0) {
                const len = Math.hypot(dx, dz);
                dx = dx / len * Math.min(len, player.speed);
                dz = dz / len * Math.min(len, player.speed);
                movePlayer(player, dx, dz);
            }

            // Aim: map mouse to ground plane (z=0)
            if (touchFire) {
                const targetX = enemy.alive ? enemy.x : player.x + 1;
                const targetZ = enemy.alive ? enemy.z : player.z;
                player.angle = Math.atan2(targetZ - player.z, targetX - player.x);
                if (player.alive) {
                    shoot(player, targetX, targetZ, false);
                }
            } else {
                // Mouse aim: project mouse to ground plane
                const rect = renderer.domElement.getBoundingClientRect();
                const ndcX = ((mouseX - rect.left) / rect.width) * 2 - 1;
                const ndcY = -((mouseY - rect.top) / rect.height) * 2 + 1;
                const vector = new THREE.Vector3(ndcX, ndcY, 0.5);
                vector.unproject(camera);
                const dir = vector.sub(camera.position).normalize();
                const distance = -camera.position.y / dir.y;
                const pos = camera.position.clone().add(dir.multiplyScalar(distance));
                const aimX = pos.x;
                const aimZ = pos.z;
                player.angle = Math.atan2(aimZ - player.z, aimX - player.x);
                // Mouse shooting: if mouseDown, shoot at aim point
                if (mouseDown && player.alive) {
                    shoot(player, aimX, aimZ, false);
                }
            }

            updateAI();

            // Update bullets
            for (let b of bullets) {
                if (!b.alive) continue;
                b.x += b.vx;
                b.z += b.vz;
                if (b.mesh) {
                    b.mesh.position.x = b.x;
                    b.mesh.position.z = b.z;
                }
                if (b.x < -BOUNDS || b.x > BOUNDS || b.z < -BOUNDS || b.z > BOUNDS) {
                    b.alive = false;
                    if (b.mesh) { scene.remove(b.mesh); b.mesh = null; }
                    continue;
                }
                let hitObstacle = false;
                for (let o of obstacles) {
                    const halfW = o.w/2, halfD = o.d/2;
                    if (b.x >= o.x - halfW && b.x <= o.x + halfW &&
                        b.z >= o.z - halfD && b.z <= o.z + halfD) {
                        hitObstacle = true;
                        break;
                    }
                }
                if (hitObstacle) {
                    b.alive = false;
                    if (b.mesh) { scene.remove(b.mesh); b.mesh = null; }
                    continue;
                }
                if (!b.isEnemy && b.alive && enemy.alive) {
                    if (dist(b.x, b.z, enemy.x, enemy.z) < enemy.radius + b.radius) {
                        enemy.health -= 35;
                        b.alive = false;
                        if (b.mesh) { scene.remove(b.mesh); b.mesh = null; }
                        if (enemy.health <= 0) { enemy.health = 0; enemy.alive = false; }
                        continue;
                    }
                }
                if (b.isEnemy && b.alive && player.alive) {
                    if (dist(b.x, b.z, player.x, player.z) < player.radius + b.radius) {
                        player.health -= 35;
                        b.alive = false;
                        if (b.mesh) { scene.remove(b.mesh); b.mesh = null; }
                        if (player.health <= 0) { player.health = 0; player.alive = false; }
                        continue;
                    }
                }
            }
            // Clean dead bullets
            bullets = bullets.filter(b => b.alive);

            // Update HUD
            hudPlayerHP.textContent = Math.ceil(player.health);
            hudEnemyHP.textContent = Math.ceil(enemy.health);
            hudTimer.textContent = Math.ceil(matchTime);

            // Check win/lose
            if (!player.alive || !enemy.alive || matchTime <= 0) {
                gameState = STATE.GAMEOVER;
                clearInterval(matchTimerInterval);
                if (matchTime <= 0 && player.alive && enemy.alive) {
                    gameOverWinner = 'timeout';
                } else if (!player.alive) {
                    gameOverWinner = 'enemy';
                } else if (!enemy.alive) {
                    gameOverWinner = 'player';
                } else {
                    gameOverWinner = 'draw';
                }
                showGameOver();
            }
        }

        // ===== Game Over =====
        function showGameOver() {
            gameOverMenu.classList.add('show');
            controlsOverlay.classList.remove('active');
            let title = '', sub = '', color = '#fff';
            if (gameOverWinner === 'player') {
                title = '🏆 YOU WIN!';
                sub = 'You eliminated the enemy!';
                color = '#44ff44';
            } else if (gameOverWinner === 'enemy') {
                title = '💀 YOU LOSE';
                sub = 'Enemy eliminated you.';
                color = '#ff4444';
            } else if (gameOverWinner === 'timeout') {
                if (player.health > enemy.health) {
                    title = '🏆 YOU WIN!';
                    sub = 'More health when time ran out.';
                    color = '#44ff44';
                } else if (enemy.health > player.health) {
                    title = '💀 YOU LOSE';
                    sub = 'Enemy had more health.';
                    color = '#ff4444';
                } else {
                    title = '🤝 DRAW';
                    sub = 'Equal health at time end.';
                    color = '#ffcc44';
                }
            } else {
                title = '🤝 DRAW';
                sub = 'Match ended.';
                color = '#ffcc44';
            }
            gameOverTitle.textContent = title;
            gameOverTitle.style.color = color;
            gameOverSub.textContent = sub;
        }

        function hideGameOver() {
            gameOverMenu.classList.remove('show');
        }

        function resetToMenu() {
            hideGameOver();
            gameState = STATE.MENU;
            menu.classList.remove('hidden');
            controlsOverlay.classList.remove('active');
            clearInterval(matchTimerInterval);
            player.health = player.maxHealth;
            player.alive = true;
            player.x = -6; player.z = 0;
            enemy.health = enemy.maxHealth;
            enemy.alive = true;
            enemy.x = 6; enemy.z = 0;
            // Clear bullets
            for (let b of bullets) {
                if (b.mesh) scene.remove(b.mesh);
            }
            bullets = [];
            matchTime = 60;
            hudTimer.textContent = '60';
            hudPlayerHP.textContent = '100';
            hudEnemyHP.textContent = '100';
            mouseDown = false;
            touchFire = false;
            joystickActive = false;
            joystickDX = 0; joystickDY = 0;
            moveJoystickThumb.style.transform = 'translate(-50%, -50%)';
            // Update meshes
            player.mesh.position.set(player.x, -0.5, player.z);
            enemy.mesh.position.set(enemy.x, -0.5, enemy.z);
        }

        function startGame() {
            menu.classList.add('hidden');
            controlsOverlay.classList.add('active');
            hideGameOver();
            player.health = player.maxHealth;
            player.alive = true;
            player.x = -6; player.z = 0;
            enemy.health = enemy.maxHealth;
            enemy.alive = true;
            enemy.x = 6; enemy.z = 0;
            for (let b of bullets) {
                if (b.mesh) scene.remove(b.mesh);
            }
            bullets = [];
            matchTime = 60;
            hudTimer.textContent = '60';
            hudPlayerHP.textContent = '100';
            hudEnemyHP.textContent = '100';
            mouseDown = false;
            touchFire = false;
            joystickActive = false;
            joystickDX = 0; joystickDY = 0;
            moveJoystickThumb.style.transform = 'translate(-50%, -50%)';
            player.mesh.position.set(player.x, -0.5, player.z);
            enemy.mesh.position.set(enemy.x, -0.5, enemy.z);

            gameState = STATE.COUNTDOWN;
            countdown = 3;
            const interval = setInterval(() => {
                countdown--;
                if (countdown < 0) {
                    clearInterval(interval);
                    gameState = STATE.PLAYING;
                    matchTimerInterval = setInterval(() => {
                        matchTime--;
                        if (matchTime <= 0) {
                            matchTime = 0;
                            // game over triggered in update
                        }
                    }, 1000);
                }
            }, 1000);
        }

        // ===== Event Listeners =====

        // Keyboard
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = true;
                e.preventDefault();
            }
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = false;
                e.preventDefault();
            }
        });

        // Mouse
        renderer.domElement.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        renderer.domElement.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                mouseDown = true;
                e.preventDefault();
            }
        });
        renderer.domElement.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                mouseDown = false;
                e.preventDefault();
            }
        });
        renderer.domElement.addEventListener('mouseleave', () => {
            mouseDown = false;
        });
        renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

        // Touch joystick
        function handleJoystickStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            if (!touch) return;
            const rect = moveJoystickBase.getBoundingClientRect();
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;
            const dx = touch.clientX - cx;
            const dy = touch.clientY - cy;
            const maxRadius = rect.width/2;
            const mag = Math.hypot(dx, dy);
            const clampedMag = Math.min(mag, maxRadius);
            const angle = Math.atan2(dy, dx);
            const thumbX = clampedMag * Math.cos(angle);
            const thumbY = clampedMag * Math.sin(angle);
            moveJoystickThumb.style.transform = `translate(${thumbX - 25}px, ${thumbY - 25}px)`;
            joystickActive = true;
            joystickDX = dx / maxRadius;
            joystickDY = dy / maxRadius;
            const clamp = (v) => Math.min(1, Math.max(-1, v));
            joystickDX = clamp(joystickDX);
            joystickDY = clamp(joystickDY);
        }
        function handleJoystickMove(e) {
            e.preventDefault();
            const touch = e.touches[0];
            if (!touch) return;
            const rect = moveJoystickBase.getBoundingClientRect();
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;
            const dx = touch.clientX - cx;
            const dy = touch.clientY - cy;
            const maxRadius = rect.width/2;
            const mag = Math.hypot(dx, dy);
            const clampedMag = Math.min(mag, maxRadius);
            const angle = Math.atan2(dy, dx);
            const thumbX = clampedMag * Math.cos(angle);
            const thumbY = clampedMag * Math.sin(angle);
            moveJoystickThumb.style.transform = `translate(${thumbX - 25}px, ${thumbY - 25}px)`;
            joystickActive = true;
            joystickDX = dx / maxRadius;
            joystickDY = dy / maxRadius;
            const clamp = (v) => Math.min(1, Math.max(-1, v));
            joystickDX = clamp(joystickDX);
            joystickDY = clamp(joystickDY);
        }
        function handleJoystickEnd(e) {
            e.preventDefault();
            moveJoystickThumb.style.transform = 'translate(-50%, -50%)';
            joystickActive = false;
            joystickDX = 0;
            joystickDY = 0;
        }
        moveJoystickArea.addEventListener('touchstart', handleJoystickStart);
        moveJoystickArea.addEventListener('touchmove', handleJoystickMove);
        moveJoystickArea.addEventListener('touchend', handleJoystickEnd);
        moveJoystickArea.addEventListener('touchcancel', handleJoystickEnd);

        // Fire button
        fireBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchFire = true;
            if (enemy.alive) {
                player.angle = Math.atan2(enemy.z - player.z, enemy.x - player.x);
            }
        });
        fireBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            touchFire = false;
        });
        fireBtn.addEventListener('touchcancel', (e) => {
            touchFire = false;
        });
        fireBtn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            touchFire = true;
            if (enemy.alive) {
                player.angle = Math.atan2(enemy.z - player.z, enemy.x - player.x);
            }
        });
        fireBtn.addEventListener('mouseup', (e) => {
            e.preventDefault();
            touchFire = false;
        });

        // Settings
        settingsBtn.addEventListener('click', () => {
            settingsPanel.classList.toggle('show');
        });
        settingsBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            settingsPanel.classList.toggle('show');
        });
        settingsCloseBtn.addEventListener('click', () => {
            settingsPanel.classList.remove('show');
        });
        settingsCloseBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            settingsPanel.classList.remove('show');
        });
        resetSettingsBtn.addEventListener('click', resetSettingsToDefault);
        resetSettingsBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            resetSettingsToDefault();
        });

        // Sliders
        function updateSettingFromSlider(slider, key, displayEl) {
            const val = parseFloat(slider.value);
            settings[key] = val;
            displayEl.textContent = val + '%';
            saveSettings();
            applySettingsToControls();
        }
        joySizeSlider.addEventListener('input', () => updateSettingFromSlider(joySizeSlider, 'joySize', joySizeVal));
        fireSizeSlider.addEventListener('input', () => updateSettingFromSlider(fireSizeSlider, 'fireSize', fireSizeVal));
        joyXSlider.addEventListener('input', () => updateSettingFromSlider(joyXSlider, 'joyX', joyXVal));
        joyYSlider.addEventListener('input', () => updateSettingFromSlider(joyYSlider, 'joyY', joyYVal));
        fireXSlider.addEventListener('input', () => updateSettingFromSlider(fireXSlider, 'fireX', fireXVal));
        fireYSlider.addEventListener('input', () => updateSettingFromSlider(fireYSlider, 'fireY', fireYVal));

        // Menu buttons
        playBtn.addEventListener('click', startGame);
        playBtn.addEventListener('touchend', (e) => { e.preventDefault(); startGame(); });
        multiBtn.addEventListener('click', () => {});
        multiBtn.addEventListener('touchend', (e) => { e.preventDefault(); });

        // Game Over return
        gameOverReturnBtn.addEventListener('click', resetToMenu);
        gameOverReturnBtn.addEventListener('touchend', (e) => { e.preventDefault(); resetToMenu(); });

        // ===== Animation loop =====
        function animate() {
            requestAnimationFrame(animate);
            update();
            // Update camera to follow player (third-person top-down)
            if (gameState === STATE.PLAYING || gameState === STATE.COUNTDOWN) {
                const targetX = player.x;
                const targetZ = player.z;
                camera.position.x = targetX;
                camera.position.z = targetZ + 20;
                camera.position.y = 15;
                camera.lookAt(targetX, 0, targetZ);
            } else {
                // Default camera when not playing
                camera.position.set(0, 25, 25);
                camera.lookAt(0, 0, 0);
            }
            renderer.render(scene, camera);
        }
        animate();

        // Handle resize
        function resize() {
            const width = container.clientWidth;
            const height = container.clientHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', resize);

        // ===== Init =====
        loadSettings();
        resetToMenu();

        // Expose for debugging
        console.log('Sniper Mecha 3D loaded');
    </script>
</body>
</html>
